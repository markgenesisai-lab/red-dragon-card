name: Codex index-only targeted fix

on:
  push:
    branches: [codex/index-only-photo-nav-fix-20260914]
    paths:
      - .github/workflows/codex-index-only-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch only index.html
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Desktop fullscreen only: clip the outgoing image and fade/slide it
          # instead of leaving the old bitmap fully visible until cleanup.
          css_marker = '</style>'
          css = '''@media(min-width:900px){#rd-red-dragon-card .rd-fullscreen-panel{overflow:hidden}#rd-red-dragon-card .rd-fullscreen-img.rd-modal-exit-left,#rd-red-dragon-card .rd-fullscreen-img.rd-modal-exit-right{opacity:0;transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .24s ease}#rd-red-dragon-card .rd-fullscreen-img.rd-modal-exit-left{transform:translate3d(-22%,0,0)}#rd-red-dragon-card .rd-fullscreen-img.rd-modal-exit-right{transform:translate3d(22%,0,0)}}#rd-red-dragon-card .rd-section-nav{z-index:60}@media(max-width:899px){#rd-red-dragon-card .rd-section-nav{z-index:120}#rd-red-dragon-card .rd-section-nav.rd-nav-fixed{z-index:1000}}'''
          if s.count(css_marker) != 1:
              raise SystemExit(f'Expected one style closing tag, found {s.count(css_marker)}')
          s = s.replace(css_marker, css + css_marker, 1)

          # 2) Both desktop/mobile nav: observe only actual nav sections.
          old_ids = "var ids=['photos','price','car-specs','inspection','equipment','price-history']"
          new_ids = "var ids=['photos','car-specs','inspection','equipment','price-history']"
          if s.count(old_ids) != 1:
              raise SystemExit(f'Navigation ids marker count: {s.count(old_ids)}')
          s = s.replace(old_ids, new_ids, 1)

          # 3) Desktop is driven by the scroll position below; keep the existing
          # IntersectionObserver behavior exclusively for mobile.
          old_obs = "obs=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(!entry.isIntersecting)return;"
          new_obs = "obs=new IntersectionObserver(function(entries){if(window.matchMedia&&window.matchMedia('(min-width:900px)').matches)return;entries.forEach(function(entry){if(!entry.isIntersecting)return;"
          if s.count(old_obs) != 1:
              raise SystemExit(f'Observer marker count: {s.count(old_obs)}')
          s = s.replace(old_obs, new_obs, 1)

          # 4) Desktop nav: photos is the default; section activation follows
          # the sticky nav boundary in both directions, including the return
          # from the bottom where Specification must become active again.
          old_tail = "ids.forEach(function(id){var el=root.querySelector('#'+id);if(el)obs.observe(el)})}setPhoto(0,false);preloadMobileGalleryImages()"
          new_tail = "ids.forEach(function(id){var el=root.querySelector('#'+id);if(el)obs.observe(el)});if(window.matchMedia&&window.matchMedia('(min-width:900px)').matches){var desktopNavRaf=0;function setDesktopNav(target){root.querySelectorAll('.rd-nav-item').forEach(function(b){var sel=b.getAttribute('data-target')===target;b.classList.toggle('sel',sel);b.setAttribute('aria-checked',sel?'true':'false')})}function updateDesktopNav(){desktopNavRaf=0;if(!window.matchMedia||!window.matchMedia('(min-width:900px)').matches)return;var nav=root.querySelector('.rd-section-nav'),items=root.querySelectorAll('.rd-nav-item');if(!nav||!items.length)return;var threshold=nav.getBoundingClientRect().bottom+18,active='photos';ids.forEach(function(id){var el=root.querySelector('#'+id);if(el&&el.getBoundingClientRect().top<=threshold)active=id});setDesktopNav(active)}function scheduleDesktopNav(){if(!desktopNavRaf)desktopNavRaf=requestAnimationFrame(updateDesktopNav)}window.addEventListener('scroll',scheduleDesktopNav,{passive:true});window.addEventListener('resize',scheduleDesktopNav,{passive:true});setDesktopNav('photos');requestAnimationFrame(updateDesktopNav)} }setPhoto(0,false);preloadMobileGalleryImages()"
          if s.count(old_tail) != 1:
              raise SystemExit(f'Navigation tail marker count: {s.count(old_tail)}')
          s = s.replace(old_tail, new_tail, 1)

          p.write_text(s, encoding='utf-8')

          # Targeted postconditions.
          assert "var ids=['photos','car-specs','inspection','equipment','price-history']" in s
          assert "var ids=['photos','price','car-specs','inspection','equipment','price-history']" not in s
          assert "if(window.matchMedia&&window.matchMedia('(min-width:900px)').matches)return;entries.forEach" in s
          assert "setDesktopNav('photos');requestAnimationFrame(updateDesktopNav)" in s
          assert '@media(min-width:900px){#rd-red-dragon-card .rd-fullscreen-panel{overflow:hidden}' in s
          assert '#rd-red-dragon-card .rd-fullscreen-img.rd-modal-exit-left,#rd-red-dragon-card .rd-fullscreen-img.rd-modal-exit-right{opacity:0;' in s

          print('index.html targeted patch checks passed')
      - name: Verify only index.html differs from parent
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          test -s index.html
          test -s tilda-loader.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/codex-index-only-fix.yml
          git add index.html .github/workflows/codex-index-only-fix.yml
          git commit -m 'Apply targeted photo and navigation fixes in index.html'
          git push origin codex/index-only-photo-nav-fix-20260914
