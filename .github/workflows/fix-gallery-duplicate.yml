name: Fix gallery duplicate photo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only gallery source ordering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="add(c&&c.cover,'cover');add(c&&c.photos,'photos');add(c&&c.images,'images');add(c&&c.media,'media');add(c&&c.photoList,'photoList');add(c&&c.gallery,'gallery');add(c&&c.pictures,'pictures');return out}  function photoCountValue"
          new="if(c&&Array.isArray(c.photos)&&c.photos.length){add(c.photos,'photos');}else if(c&&Array.isArray(c.images)&&c.images.length){add(c.images,'images');}else if(c&&Array.isArray(c.media)&&c.media.length){add(c.media,'media');}else if(c&&Array.isArray(c.photoList)&&c.photoList.length){add(c.photoList,'photoList');}else if(c&&Array.isArray(c.gallery)&&c.gallery.length){add(c.gallery,'gallery');}else if(c&&Array.isArray(c.pictures)&&c.pictures.length){add(c.pictures,'pictures');}else{add(c&&c.cover,'cover');}return out}  function photoCountValue"
          if s.count(old)!=1: raise SystemExit('exact target not found exactly once; aborting')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        run: node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw new Error('main script not found');new Function(m[1]);console.log('JS syntax OK')"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "fix gallery duplicate cover photo"
          git push
