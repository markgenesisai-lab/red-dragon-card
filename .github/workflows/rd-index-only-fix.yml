name: RD index only fix
on:
  push:
    branches:
      - codex-price-history-nav-fix-20260914
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch index.html only
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function updateDesktopNav(){desktopNavRaf=0;if(!window.matchMedia||!window.matchMedia('(min-width:900px)').matches)return;var nav=root.querySelector('.rd-section-nav'),items=root.querySelectorAll('.rd-nav-item');if(!nav||!items.length)return;var threshold=nav.getBoundingClientRect().bottom+18,active='photos';ids.forEach(function(id){var el=root.querySelector('#'+id);if(el&&el.getBoundingClientRect().top<=threshold)active=id});setDesktopNav(active)}"
          new = "function updateDesktopNav(){desktopNavRaf=0;if(!window.matchMedia||!window.matchMedia('(min-width:900px)').matches)return;var nav=root.querySelector('.rd-section-nav'),items=root.querySelectorAll('.rd-nav-item');if(!nav||!items.length)return;var threshold=nav.getBoundingClientRect().bottom+18,active='photos';ids.forEach(function(id){var el=root.querySelector('#'+id);if(el&&el.getBoundingClientRect().top<=threshold)active=id});if(window.scrollY+window.innerHeight>=document.documentElement.scrollHeight-2)active='price-history';setDesktopNav(active)}"
          assert old in s, 'target block not found'
          assert s.count(old) == 1, 'target block count is not 1'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify and self-remove workflow
        shell: bash
        run: |
          test -f index.html
          grep -F "window.scrollY+window.innerHeight>=document.documentElement.scrollHeight-2" index.html
          test "$(git diff --name-only)" = "index.html"
          rm -f .github/workflows/rd-index-only-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/rd-index-only-fix.yml
          git commit -m "fix: activate price history at page bottom"
          git push