name: RD UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact patch
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Mobile: move Back down by half of the current bottom gap (36px -> 18px).
          old = '@media(max-width:899px){#rd-red-dragon-card .rd-back-button{right:auto;left:50%;bottom:36px;transform:translateX(-50%)}'
          new = '@media(max-width:899px){#rd-red-dragon-card .rd-back-button{right:auto;left:50%;bottom:18px;transform:translateX(-50%)}'
          if old not in s: raise SystemExit('BACK CSS target not found')
          s = s.replace(old, new, 1)

          # Mobile: lift only the registration icon slightly so it aligns with the other cards.
          marker = '@media(max-width:760px){#rd-red-dragon-card .rd-fullscreen-close{top:64px;right:0;z-index:10}'
          if marker not in s: raise SystemExit('MOBILE CSS anchor not found')
          reg_rule = '@media(max-width:760px){#rd-red-dragon-card .rd-key-spec-registration .rd-key-spec-label svg{transform:translateY(-1px)}}'
          if reg_rule not in s:
              s = s.replace(marker, reg_rule + marker, 1)

          # Both versions: the opened inspection item gets the same red active treatment as factory specification.
          spec_rule = '#rd-red-dragon-card .rd-accordion.open .rd-acc-btn{color:var(--rd-accent)}#rd-red-dragon-card .rd-accordion.open .rd-acc-count{color:var(--rd-accent)}#rd-red-dragon-card .rd-accordion.open .rd-acc-btn svg{color:var(--rd-accent)}'
          report_rule = '#rd-red-dragon-card .rd-report-accordion.open .rd-report-accordion-trigger{color:var(--rd-accent)}#rd-red-dragon-card .rd-report-accordion.open .rd-report-accordion-meta{color:var(--rd-accent)}#rd-red-dragon-card .rd-report-accordion.open .rd-report-accordion-count{color:var(--rd-accent)}#rd-red-dragon-card .rd-report-accordion.open .rd-report-accordion-indicator{color:var(--rd-accent)}'
          if spec_rule not in s: raise SystemExit('SPEC active rule target not found')
          if report_rule not in s: s = s.replace(spec_rule, spec_rule + report_rule, 1)

          # Browser/device Back: close one UI layer at a time; only with nothing open leave the card for the catalog.
          old_go = "function goBack(){if(document.referrer&&document.referrer.indexOf(location.origin)===0&&history.length>1){history.back();return}location.href='/catalog/'}"
          new_go = "function goBack(){var modal=root.querySelector('.rd-modal.open');if(modal){closeModal(modal.id);return}var feedback=root.querySelector('#rd-feedback-modal.open');if(feedback){closeFeedbackModal();return}var acc=root.querySelector('.rd-accordion.open');if(acc){var btn=acc.querySelector('.rd-acc-btn');acc.classList.remove('open');if(btn)btn.setAttribute('aria-expanded','false');return}var reportAcc=root.querySelector('.rd-report-accordion.open');if(reportAcc){var rbtn=reportAcc.querySelector('.rd-report-accordion-trigger');reportAcc.classList.remove('open');if(rbtn)rbtn.setAttribute('aria-expanded','false');return}location.href='/catalog/'}"
          if old_go not in s: raise SystemExit('goBack target not found')
          s = s.replace(old_go, new_go, 1)

          # Intercept native mobile Back/gesture as one-action navigation inside the card.
          anchor = "function closeFeedbackModal(){var m=root.querySelector('#rd-feedback-modal');if(!m)return;m.classList.remove('open');m.setAttribute('aria-hidden','true')}function submitFeedbackForm"
          handler = "function handleDeviceBack(){var modal=root.querySelector('.rd-modal.open');if(modal){closeModal(modal.id);return true}var feedback=root.querySelector('#rd-feedback-modal.open');if(feedback){closeFeedbackModal();return true}var reportAcc=root.querySelector('.rd-report-accordion.open');if(reportAcc){var rb=reportAcc.querySelector('.rd-report-accordion-trigger');reportAcc.classList.remove('open');if(rb)rb.setAttribute('aria-expanded','false');return true}var acc=root.querySelector('.rd-accordion.open');if(acc){var ab=acc.querySelector('.rd-acc-btn');acc.classList.remove('open');if(ab)ab.setAttribute('aria-expanded','false');return true}return false} function submitFeedbackForm"
          if anchor not in s: raise SystemExit('DEVICE BACK anchor not found')
          s = s.replace(anchor, handler, 1)

          wire_anchor = "root.querySelectorAll('.rd-acc-btn').forEach(function(b){b.addEventListener('click',function(){var parent=b.closest('.rd-accordion'),open=!parent.classList.contains('open');parent.classList.toggle('open',open);b.setAttribute('aria-expanded',open?'true':'false')})});"
          if wire_anchor not in s: raise SystemExit('ACC wire target not found')
          wire_insert = "window.addEventListener('popstate',function(){if(!handleDeviceBack()){location.href='/catalog/'}});"
          if wire_insert not in s:
              s = s.replace(wire_anchor, wire_anchor + wire_insert, 1)

          if s == original: raise SystemExit('NO CHANGES')
          p.write_text(s, encoding='utf-8')

          # Structural checks: exactly the requested targets are present.
          out = p.read_text(encoding='utf-8')
          checks = {
              'back-bottom-18': '@media(max-width:899px){#rd-red-dragon-card .rd-back-button{right:auto;left:50%;bottom:18px;transform:translateX(-50%)}' in out,
              'registration-icon-lift': 'rd-key-spec-registration .rd-key-spec-label svg{transform:translateY(-1px)}' in out,
              'report-active-red': 'rd-report-accordion.open .rd-report-accordion-trigger{color:var(--rd-accent)}' in out,
              'device-back-handler': 'function handleDeviceBack()' in out and "window.addEventListener('popstate',function(){if(!handleDeviceBack()){location.href='/catalog/'}});" in out,
              'mobile-buy-absent': 'rd-mobile-buy' not in out,
          }
          bad = [k for k,v in checks.items() if not v]
          if bad: raise SystemExit('CHECK FAILED: ' + ', '.join(bad))

      - name: Commit exact patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/rd-ui-fix.yml
          git rm .github/workflows/rd-ui-fix.yml
          git diff --cached --check
          git commit -m 'fix: refine mobile back and inspection UI'
          git push