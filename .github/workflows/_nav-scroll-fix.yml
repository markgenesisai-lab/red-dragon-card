name: Temporary nav scroll fix
on:
  push:
    paths:
      - _trigger-nav-scroll-fix.txt
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex-nav-scroll-fix-20260914
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function scrollToTarget(id){var el=root.querySelector('#'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}"
          new = """function scrollToTarget(id){var el=root.querySelector('#'+id);if(!el)return;var headerH=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header-h'))||0;var nav=root.querySelector('.rd-section-nav'),navH=nav?nav.getBoundingClientRect().height:0,offset=headerH+navH+12,node=el.parentElement,scroller=null;while(node&&node!==document.body&&node!==document.documentElement){var cs=getComputedStyle(node),oy=cs.overflowY;if((oy==='auto'||oy==='scroll'||oy==='overlay')&&node.scrollHeight>node.clientHeight){scroller=node;break}node=node.parentElement}if(scroller){var sr=scroller.getBoundingClientRect(),er=el.getBoundingClientRect(),top=scroller.scrollTop+(er.top-sr.top)-offset;scroller.scrollTo({top:Math.max(0,top),behavior:'smooth'});return}var doc=document.scrollingElement||document.documentElement,top=el.getBoundingClientRect().top+(window.pageYOffset||doc.scrollTop)-offset;window.scrollTo({top:Math.max(0,top),behavior:'smooth'})}"""
          if s.count(old) != 1:
              raise SystemExit(f'expected one scrollToTarget block, found {s.count(old)}')
          s = s.replace(old, new)
          old2 = "b.addEventListener('click',function(){root.querySelectorAll('.rd-nav-item').forEach(function(x){x.classList.remove('sel');x.setAttribute('aria-checked','false')});b.classList.add('sel');b.setAttribute('aria-checked','true');scrollToTarget(b.getAttribute('data-target'))})"
          new2 = "b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();root.querySelectorAll('.rd-nav-item').forEach(function(x){x.classList.remove('sel');x.setAttribute('aria-checked','false')});b.classList.add('sel');b.setAttribute('aria-checked','true');scrollToTarget(b.getAttribute('data-target'))})"
          if s.count(old2) != 1:
              raise SystemExit(f'expected one nav click block, found {s.count(old2)}')
          s = s.replace(old2, new2)
          if "function scrollToTarget(id){var el=root.querySelector('#'+id);if(!el)return;" not in s:
              raise SystemExit('new scrollToTarget not present')
          if "e.preventDefault();e.stopPropagation();" not in s:
              raise SystemExit('click guard not present')
          p.write_text(s, encoding='utf-8')
      - name: Remove temporary workflow and trigger
        run: |
          rm -f .github/workflows/_nav-scroll-fix.yml _trigger-nav-scroll-fix.txt
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/_nav-scroll-fix.yml _trigger-nav-scroll-fix.txt
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: make section navigation scroll reliably"
          git push origin HEAD:codex-nav-scroll-fix-20260914
