name: Adjust mobile section navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only mobile navigation CSS changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
            (
              '#rd-red-dragon-card .rd-section-nav{position:sticky;top:var(--header-h,62px);z-index:100;background:color-mix(in oklch,var(--rd-bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}',
              '#rd-red-dragon-card .rd-section-nav{position:sticky;top:var(--header-h,62px);z-index:100;padding:1px 0;background:color-mix(in oklch,var(--rd-bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}'
            ),
            (
              '#rd-red-dragon-card .rd-segment{width:100%;justify-content:center;overflow-x:auto;margin:0}',
              '#rd-red-dragon-card .rd-segment{width:100%;justify-content:stretch;overflow:hidden;margin:0;padding:1px}'
            ),
            (
              '#rd-red-dragon-card .rd-segment button{min-height:44px;min-width:44px;padding:0 10px;border-radius:13px;font-size:12px}',
              '#rd-red-dragon-card .rd-segment button{flex:1 1 0;min-height:24px;min-width:0;padding:0 4px;border-radius:8px;font-size:12px}'
            ),
            (
              '#rd-red-dragon-card .rd-segment button svg{width:22px;height:22px}',
              '#rd-red-dragon-card .rd-segment button svg{width:18px;height:18px}'
            ),
            (
              '#rd-red-dragon-card .rd-segment button.sel{min-height:48px;min-width:50px;padding:0 14px;border-radius:15px}',
              '#rd-red-dragon-card .rd-segment button.sel{min-height:28px;min-width:0;padding:0 4px;border-radius:9px}'
            ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly 1 occurrence, found {count}: {old}')
              s = s.replace(old, new, 1)

          marker = '</style>'
          override = '@media(max-width:760px){#rd-red-dragon-card .rd-section-nav.rd-nav-fixed{padding:1px 10px}}'
          count = s.count(override)
          if count:
              raise SystemExit('Mobile nav override already present; aborting')
          pos = s.rfind(marker)
          if pos < 0:
              raise SystemExit('style closing tag not found; aborting')
          s = s[:pos] + override + s[pos:]

          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify only intended CSS changes
        shell: bash
        run: |
          git diff --check
          git diff --unified=0 -- index.html
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Reduce mobile section navigation height"
          git push
