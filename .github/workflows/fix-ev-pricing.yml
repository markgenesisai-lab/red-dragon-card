name: fix-ev-pricing
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unverified EV zero
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="if(fuel==='electric'||fuel==='ev')return 0;"
          new="if(fuel==='electric'||fuel==='ev')return null;"
          if s.count(old)!=1: raise SystemExit('EV rule target not found')
          s=s.replace(old,new,1)
          if s.count(new)!=1: raise SystemExit('EV rule replacement failed')
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          test "$(git diff --cached --name-only)" = "index.html"
          git diff --cached --check
          git commit -m 'fix: avoid unverified zero customs for EV'
          git rm .github/workflows/fix-ev-pricing.yml
          git commit -m 'chore: remove temporary EV pricing workflow'
          git push