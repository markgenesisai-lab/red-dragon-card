name: _ev-age-finalize
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'fix: EV pricing uses vehicle year fallback for age band'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact EV age fallback
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function priceData(c){var sourceUsd=sourcePriceUsd(c),rate=apiRate(),usdPerEur=apiUsdPerEur(),deliveryActualUsd=sourceUsd!=null?pricingDeliveryUsd(c):null,markupRate=pricingMarkupRate(sourceUsd),markupUsd=sourceUsd!=null&&markupRate!=null?sourceUsd*markupRate:null,deliveryUsd=sourceUsd!=null&&deliveryActualUsd!=null&&markupUsd!=null?sourceUsd+deliveryActualUsd+markupUsd:null,customsBaseUsd=sourceUsd!=null&&deliveryActualUsd!=null?sourceUsd+deliveryActualUsd:null,sourceByn=sourceUsd!=null&&rate!=null?bynNumber(sourceUsd*rate):null,deliveryByn=deliveryUsd!=null&&rate!=null?bynNumber(deliveryUsd*rate):null,customsPaymentEuro=customsBaseUsd!=null?calcCustomsPaymentEuro(c,customsBaseUsd):null,customsPaymentAfter140Eur=customsPaymentEuro!=null?customsPaymentEuro*0.5:null,customsPaymentUsd=customsPaymentAfter140Eur===0?0:(customsPaymentAfter140Eur!=null&&usdPerEur!=null?customsPaymentAfter140Eur*usdPerEur:null),ageBand=pricingAgeBand(c),recyclingByn=recyclingFeeByn(ageBand),customsOpsByn=120,svhByn=1100"
          new="function priceData(c){var sourceUsd=sourcePriceUsd(c),rate=apiRate(),usdPerEur=apiUsdPerEur(),deliveryActualUsd=sourceUsd!=null?pricingDeliveryUsd(c):null,markupRate=pricingMarkupRate(sourceUsd),markupUsd=sourceUsd!=null&&markupRate!=null?sourceUsd*markupRate:null,deliveryUsd=sourceUsd!=null&&deliveryActualUsd!=null&&markupUsd!=null?sourceUsd+deliveryActualUsd+markupUsd:null,customsBaseUsd=sourceUsd!=null&&deliveryActualUsd!=null?sourceUsd+deliveryActualUsd:null,sourceByn=sourceUsd!=null&&rate!=null?bynNumber(sourceUsd*rate):null,deliveryByn=deliveryUsd!=null&&rate!=null?bynNumber(deliveryUsd*rate):null,customsPaymentEuro=customsBaseUsd!=null?calcCustomsPaymentEuro(c,customsBaseUsd):null,customsPaymentAfter140Eur=customsPaymentEuro!=null?customsPaymentEuro*0.5:null,customsPaymentUsd=customsPaymentAfter140Eur===0?0:(customsPaymentAfter140Eur!=null&&usdPerEur!=null?customsPaymentAfter140Eur*usdPerEur:null),ageBand=pricingAgeBand(c);if(['electric','ev','bev','electricity'].indexOf(sourceFuelCode(c))>=0&&!ageBand){var ey=Number(c.manufacturingYear??c.productionYear??c.year);if(Number.isInteger(ey)&&ey>1900){var eyDiff=new Date().getFullYear()-ey;ageBand=eyDiff<=3?'0_3':eyDiff<=5?'3_5':'5_plus'}}var recyclingByn=recyclingFeeByn(ageBand),customsOpsByn=120,svhByn=1100"
          assert s.count(old)==1, f'target count {s.count(old)}'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify exact diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --numstat -- index.html | awk '{print $1}')" = "1"
          test "$(git diff --numstat -- index.html | awk '{print $2}')" = "1"
          grep -Fq "eyDiff<=3?'0_3':eyDiff<=5?'3_5':'5_plus'" index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: EV pricing uses vehicle year fallback for age band'
          git rm .github/workflows/_ev-age-finalize.yml
          git commit -m 'chore: remove temporary EV age workflow'
          git push
