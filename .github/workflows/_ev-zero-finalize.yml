name: _ev-zero-finalize
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'fix: EV zero customs without EUR dependency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exactly one EV formula fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "customsPaymentUsd=customsPaymentAfter140Eur!=null&&usdPerEur!=null?customsPaymentAfter140Eur*usdPerEur:null"
          new = "customsPaymentUsd=customsPaymentAfter140Eur===0?0:(customsPaymentAfter140Eur!=null&&usdPerEur!=null?customsPaymentAfter140Eur*usdPerEur:null)"
          assert s.count(old) == 1, f'Expected exactly one formula target, found {s.count(old)}'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify and remove workflow
        shell: bash
        run: |
          git diff --check
          git diff -- index.html
          test "$(git diff --numstat -- index.html | awk '{print $1}')" = "1"
          test "$(git diff --numstat -- index.html | awk '{print $2}')" = "1"
          grep -Fq "customsPaymentUsd=customsPaymentAfter140Eur===0?0:" index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: EV zero customs without EUR dependency'
          git rm .github/workflows/_ev-zero-finalize.yml
          git commit -m 'chore: remove temporary EV zero workflow'
          git push
