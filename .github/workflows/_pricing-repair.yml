name: _pricing-repair

on:
  push:
    paths:
      - '.github/workflows/_pricing-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair pricing mechanism
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''function extractCatalogPrice(c){var sp=c&&c.sourcePrice;if(!sp)return null;var v=sp.usd!=null&&sp.usd!==''?Number(sp.usd):null;return Number.isFinite(v)?v:null}'''
          new = '''function extractCatalogPrice(c){var sp=c&&c.sourcePrice;if(!sp)return null;var v=sp.usd!=null&&sp.usd!==''?Number(sp.usd):null;if(!Number.isFinite(v)&&sp.amount!=null&&sp.amount!==''&&String(sp.currency||'').trim().toUpperCase()==='USD')v=Number(String(sp.amount).replace(',','.'));return Number.isFinite(v)&&v>=0?v:null}'''
          assert old in s, 'extractCatalogPrice block not found'
          s=s.replace(old,new,1)

          old = '''async function loadCatalogPricing(id,detail){var usdValue=extractCatalogPrice(detail),rate=null,item=null;try{var qs=new URLSearchParams({page:'1',pageSize:'30',sort:'added',order:'desc',q:String(id||'')}),d=await getRaw('/listings?'+qs.toString()),items=Array.isArray(d)?d:(d.items||d.listings||d.results||d.data?.items||d.data?.listings||d.data?.results||d.data?.cars||d.cars||[]);item=items.find(function(x){return String(x&&x.id||'')===String(id||'')})||null;if(item){var itemUsd=extractCatalogPrice(item);if(itemUsd!=null)usdValue=itemUsd}rate=Number(d&&d.meta&&d.meta.rates&&d.meta.rates.perUsd&&d.meta.rates.perUsd.BYN);if(!Number.isFinite(rate)||rate<=0)rate=Number(d&&d.data&&d.data.meta&&d.data.meta.rates&&d.data.meta.rates.perUsd&&d.data.meta.rates.perUsd.BYN);if(!Number.isFinite(rate)||rate<=0)rate=null;if(rate==null){var dr=detail&&detail.meta&&detail.meta.rates&&detail.meta.rates.perUsd&&detail.meta.rates.perUsd.BYN;rate=Number(dr);if(!Number.isFinite(rate)||rate<=0)rate=null}}catch(e){rate=null}return{usd:usdValue,rate:rate,country:sourceCountryCode(item||detail),item:item}}'''
          new = '''function validUsdToBynRate(v){var n=Number(v);return Number.isFinite(n)&&n>=1.5&&n<=10?n:null} function extractBynRate(x){if(!x||typeof x!=='object')return null;var candidates=[x.usdToByn,x.USD_Byn,x.usd_byn,x.perUsd&&x.perUsd.BYN,x.rates&&x.rates.perUsd&&x.rates.perUsd.BYN,x.meta&&x.meta.rates&&x.meta.rates.perUsd&&x.meta.rates.perUsd.BYN,x.data&&x.data.meta&&x.data.meta.rates&&x.data.meta.rates.perUsd&&x.data.meta.rates.perUsd.BYN];for(var i=0;i<candidates.length;i++){var n=validUsdToBynRate(candidates[i]);if(n!=null)return n}return null} async function loadOfficialUsdToByn(){try{var r=await fetch('https://api.nbrb.by/exrates/rates/431?parammode=2',{headers:{Accept:'application/json'},cache:'no-store'});if(!r.ok)return null;var d=await r.json().catch(function(){return null}),scale=Number(d&&d.Cur_Scale)||1,official=Number(d&&d.Cur_OfficialRate);if(!Number.isFinite(official)||official<=0||!Number.isFinite(scale)||scale<=0)return null;return validUsdToBynRate(official/scale)}catch(e){return null}} async function loadCatalogPricing(id,detail){var usdValue=extractCatalogPrice(detail),rate=extractBynRate(detail),item=null;try{var qs=new URLSearchParams({page:'1',pageSize:'30',sort:'added',order:'desc',q:String(id||'')}),d=await getRaw('/listings?'+qs.toString()),items=Array.isArray(d)?d:(d.items||d.listings||d.results||d.data?.items||d.data?.listings||d.data?.results||d.data?.cars||d.cars||[]);item=items.find(function(x){return String(x&&x.id||'')===String(id||'')})||null;if(item){var itemUsd=extractCatalogPrice(item);if(itemUsd!=null)usdValue=itemUsd;var itemRate=extractBynRate(item);if(itemRate!=null)rate=itemRate}if(rate==null)rate=extractBynRate(d)}catch(e){}if(rate==null)rate=await loadOfficialUsdToByn();return{usd:usdValue,rate:rate,country:sourceCountryCode(item||detail),item:item}}'''
          assert old in s, 'loadCatalogPricing block not found'
          s=s.replace(old,new,1)

          old = '''function sourceFuelCode(c){var v=c&&c.specs&&typeof c.specs==='object'?c.specs.fuel:null;v=v==null&&c?c.fuel:null;return String(v==null?'':v).trim().toLowerCase()} function sourceDisplacement(c){var s=c&&c.specs&&typeof c.specs==='object'?c.specs:{};var v=c&&c.displacement!=null?c.displacement:s.displacement;var n=Number(v);return Number.isFinite(n)&&n>0?n:null}'''
          new = '''function sourceFuelCode(c){var s=c&&c.specs&&typeof c.specs==='object'?c.specs:{},v=s.fuel??s.fuelType??s.fuel_type??c&&c.fuel??c&&c.fuelType??c&&c.fuel_type;return String(v==null?'':v).trim().toLowerCase()} function sourceDisplacement(c){var s=c&&c.specs&&typeof c.specs==='object'?c.specs:{},v=c&&c.displacement!=null?c.displacement:s.displacement;if(v==null||v==='')v=c&&c.engineVolume!=null?c.engineVolume:c&&c.engine_volume!=null?c.engine_volume:s.engineVolume??s.engine_volume;if(typeof v==='string')v=v.trim().replace(',','.').replace(/\\s*(cc|cm3|см3|л)\\s*$/i,'');var n=Number(v);if(!Number.isFinite(n)||n<=0)return null;if(n<20)n*=1000;return n}'''
          assert old in s, 'fuel/displacement block not found'
          s=s.replace(old,new,1)

          old = '''function calcCustomsPaymentEuro(c,customsBaseUsd){var fuel=sourceFuelCode(c),band=pricingAgeBand(c),usdPerEur=apiUsdPerEur(),displacement=sourceDisplacement(c);if(fuel==='electric'||fuel==='ev')return null;if(!band||usdPerEur==null||!Number.isFinite(customsBaseUsd)||customsBaseUsd<0)return null;var baseEur=customsBaseUsd/usdPerEur;if(band==='0_3')return customsRateUpTo3(baseEur,displacement);var rate=customsRateForDisplacement(displacement,band);return rate==null?null:displacement*rate}'''
          new = '''function calcCustomsPaymentEuro(c,customsBaseUsd){var fuel=sourceFuelCode(c),band=pricingAgeBand(c),usdPerEur=apiUsdPerEur(),displacement=sourceDisplacement(c);if(['electric','ev','bev','electricity'].indexOf(fuel)>=0)return null;if(!band||usdPerEur==null||!Number.isFinite(customsBaseUsd)||customsBaseUsd<0)return null;var customsValueEur=customsBaseUsd/usdPerEur;if(band==='0_3')return customsRateUpTo3(customsValueEur,displacement);var tariff=customsRateForDisplacement(displacement,band);return tariff==null?null:displacement*tariff}'''
          assert old in s, 'calcCustomsPaymentEuro block not found'
          s=s.replace(old,new,1)

          old = '''function priceData(c){var sourceUsd=sourcePriceUsd(c),rate=apiRate(),usdPerEur=apiUsdPerEur(),deliveryActualUsd=sourceUsd!=null?pricingDeliveryUsd(c):null,markupRate=pricingMarkupRate(sourceUsd),markupUsd=sourceUsd!=null&&markupRate!=null?sourceUsd*markupRate:null,deliveryUsd=sourceUsd!=null&&deliveryActualUsd!=null&&markupUsd!=null?sourceUsd+deliveryActualUsd+markupUsd:null,customsBaseUsd=sourceUsd!=null&&deliveryActualUsd!=null?sourceUsd+deliveryActualUsd:null,sourceByn=sourceUsd!=null&&rate!=null?bynNumber(sourceUsd*rate):null,deliveryByn=deliveryUsd!=null&&rate!=null?bynNumber(deliveryUsd*rate):null,customsPaymentEuro=customsBaseUsd!=null?calcCustomsPaymentEuro(c,customsBaseUsd):null,customsPaymentAfter140Eur=customsPaymentEuro!=null?customsPaymentEuro*0.5:null,customsPaymentUsd=customsPaymentAfter140Eur!=null&&usdPerEur!=null?customsPaymentAfter140Eur*usdPerEur:null,ageBand=pricingAgeBand(c),recyclingByn=recyclingFeeByn(ageBand),customsOpsByn=120,svhByn=400,fixedByn=recyclingByn!=null?recyclingByn+customsOpsByn+svhByn:null,customsByn=deliveryByn!=null&&customsPaymentUsd!=null&&rate!=null&&fixedByn!=null?deliveryByn+customsPaymentUsd*rate+fixedByn:null,customsUsd=deliveryUsd!=null&&customsPaymentUsd!=null&&rate!=null&&fixedByn!=null?deliveryUsd+customsPaymentUsd+fixedByn/rate:null;return{sourceUsd:sourceUsd,sourceByn:sourceByn,rate:rate,deliveryActualUsd:deliveryActualUsd,markupRate:markupRate,markupUsd:markupUsd,deliveryUsd:deliveryUsd,deliveryByn:deliveryByn,customsBaseUsd:customsBaseUsd,customsPaymentEuro:customsPaymentEuro,customsPaymentAfter140Eur:customsPaymentAfter140Eur,customsPaymentUsd:customsPaymentUsd,ageBand:ageBand,recyclingByn:recyclingByn,customsOpsByn:customsOpsByn,svhByn:svhByn,customsUsd:customsUsd,customsByn:customsByn}}'''
          new = '''function priceData(c){var sourceUsd=sourcePriceUsd(c),rate=apiRate(),usdPerEur=apiUsdPerEur(),deliveryActualUsd=sourceUsd!=null?pricingDeliveryUsd(c):null,markupRate=pricingMarkupRate(sourceUsd),markupUsd=sourceUsd!=null&&markupRate!=null?sourceUsd*markupRate:null,deliveryUsd=sourceUsd!=null&&deliveryActualUsd!=null&&markupUsd!=null?sourceUsd+deliveryActualUsd+markupUsd:null,customsBaseUsd=sourceUsd!=null&&deliveryActualUsd!=null?sourceUsd+deliveryActualUsd:null,sourceByn=sourceUsd!=null&&rate!=null?bynNumber(sourceUsd*rate):null,deliveryByn=deliveryUsd!=null&&rate!=null?bynNumber(deliveryUsd*rate):null,customsPaymentEuro=customsBaseUsd!=null?calcCustomsPaymentEuro(c,customsBaseUsd):null,customsPaymentAfter140Eur=customsPaymentEuro!=null?customsPaymentEuro*0.5:null,customsPaymentUsd=customsPaymentAfter140Eur!=null&&usdPerEur!=null?customsPaymentAfter140Eur*usdPerEur:null,ageBand=pricingAgeBand(c),recyclingByn=recyclingFeeByn(ageBand),customsOpsByn=120,svhByn=400,fixedByn=recyclingByn!=null?recyclingByn+customsOpsByn+svhByn:null,customsByn=null,customsUsd=null;if(deliveryByn!=null&&customsPaymentUsd!=null&&rate!=null&&fixedByn!=null)customsByn=bynNumber(deliveryByn+customsPaymentUsd*rate+fixedByn);if(deliveryUsd!=null&&customsPaymentUsd!=null&&rate!=null&&fixedByn!=null)customsUsd=deliveryUsd+customsPaymentUsd+fixedByn/rate;return{sourceUsd:sourceUsd,sourceByn:sourceByn,rate:rate,deliveryActualUsd:deliveryActualUsd,markupRate:markupRate,markupUsd:markupUsd,deliveryUsd:deliveryUsd,deliveryByn:deliveryByn,customsBaseUsd:customsBaseUsd,customsPaymentEuro:customsPaymentEuro,customsPaymentAfter140Eur:customsPaymentAfter140Eur,customsPaymentUsd:customsPaymentUsd,ageBand:ageBand,recyclingByn:recyclingByn,customsOpsByn:customsOpsByn,svhByn:svhByn,customsUsd:customsUsd,customsByn:customsByn}}'''
          assert old in s, 'priceData block not found'
          s=s.replace(old,new,1)

          old = '''function bynNumber(v){if(v==null||v==='')return null;var n=Number(v);return Number.isFinite(n)?Math.round(n/10)*10:null}'''
          new = '''function bynNumber(v){if(v==null||v==='')return null;var n=Number(v);return Number.isFinite(n)?Math.round(n/10)*10:null}'''
          assert old in s

          p.write_text(s,encoding='utf-8')
          PY

          git diff --check
          git status --short
          git diff -- index.html | head -c 20000
          if git diff --quiet -- index.html; then
            echo 'NO_CHANGE'
            exit 0
          fi
          git config user.name 'red-dragon-pricing-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: repair complete vehicle pricing mechanism'
          git push

      - name: Remove repair workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/_pricing-repair.yml
          git config user.name 'red-dragon-pricing-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -u .github/workflows/_pricing-repair.yml
          git commit -m 'chore: remove temporary pricing repair workflow' || exit 0
          git push
