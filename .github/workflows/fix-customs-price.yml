name: fix-customs-price
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only EUR pricing state and loader
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ("__rdPricing={usd:null,rate:null,country:'CN'}", "__rdPricing={usd:null,rate:null,eurRate:null,country:'CN'}"),
            ("return{usd:usdValue,rate:rate,country:sourceCountryCode(item||detail),item:item}} function sourceCountryCode", "return{usd:usdValue,rate:rate,eurRate:eurRate,country:sourceCountryCode(item||detail),item:item}} function sourceCountryCode"),
            ("var usdValue=extractCatalogPrice(detail),rate=null,item=null;", "var usdValue=extractCatalogPrice(detail),rate=null,eurRate=null,item=null;"),
            ("if(!Number.isFinite(rate)||rate<=0)rate=null;if(rate==null){var dr=detail&&detail.meta&&detail.meta.rates&&detail.meta.rates.perUsd&&detail.meta.rates.perUsd.BYN;rate=Number(dr);if(!Number.isFinite(rate)||rate<=0)rate=null}}catch(e){}return{", "if(!Number.isFinite(rate)||rate<=0)rate=null;if(rate==null){var dr=detail&&detail.meta&&detail.meta.rates&&detail.meta.rates.perUsd&&detail.meta.rates.perUsd.BYN;rate=Number(dr);if(!Number.isFinite(rate)||rate<=0)rate=null}eurRate=Number(d&&d.meta&&d.meta.rates&&d.meta.rates.perUsd&&d.meta.rates.perUsd.EUR);if(!Number.isFinite(eurRate)||eurRate<=0)eurRate=Number(d&&d.data&&d.data.meta&&d.data.meta.rates&&d.data.meta.rates.perUsd&&d.data.meta.rates.perUsd.EUR);if(!Number.isFinite(eurRate)||eurRate<=0)eurRate=Number(detail&&detail.meta&&detail.meta.rates&&detail.meta.rates.perUsd&&detail.meta.rates.perUsd.EUR);if(!Number.isFinite(eurRate)||eurRate<=0)eurRate=null}catch(e){rate=null;eurRate=null}return{"),
            ("__rdPricing.country=pricing.country;__rdSourceUpdatedAt", "__rdPricing.country=pricing.country;__rdPricing.eurRate=pricing.eurRate;__rdSourceUpdatedAt")
          ]
          for old, new in replacements:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'target count {n} for: {old[:100]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- index.html
          git status --short
          test "$(git diff --name-only)" = "index.html"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git commit -m 'fix: load EUR rate for customs price'
          git rm .github/workflows/fix-customs-price.yml
          git commit -m 'chore: remove temporary customs pricing workflow'
          git push origin HEAD:main
