name: Targeted hybrid pricing fix

on:
  push:
    paths:
      - '.github/workflows/_fix-hybrid-classification.yml'

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch only hybrid pricing logic
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_helper = "function sourceFuelCode(c){var s=c&&c.specs&&typeof c.specs==='object'?c.specs:{},keys=['fuel','fuelType','fuel_type','energy','energyType','energy_type'];for(var i=0;i<keys.length;i++){var k=keys[i],sv=s[k],cv=c&&c[k];if(sv!=null&&String(sv).trim()!=='')return String(sv).trim().toLowerCase();if(cv!=null&&String(cv).trim()!=='')return String(cv).trim().toLowerCase()}return''}"
          new_helper = old_helper + " function sourceHybridType(c){var s=c&&c.specs&&typeof c.specs==='object'?c.specs:{},keys=['hybridType','hybrid_type','hybridMode','hybrid_mode','hybridArchitecture','hybrid_architecture','powertrainType','powertrain_type','propulsionType','propulsion_type','engineType','engine_type','architecture'];for(var i=0;i<keys.length;i++){var v=s[keys[i]]!=null?s[keys[i]]:c&&c[keys[i]];if(v==null)continue;var x=String(v).trim().toLowerCase();if(/(^|[^a-zа-я])(series|serial|sequential|reev|erev|range[ -]?extended|последовательн)/i.test(x))return'series';if(/(^|[^a-zа-я])(parallel|параллельн)/i.test(x))return'parallel'}var f=sourceFuelCode(c);if(['erev','reev','series_hybrid','series-hybrid','serial_hybrid','serial-hybrid','range_extended','range-extended','extended_range'].indexOf(f)>=0)return'series';return''}"
          if s.count(old_helper) != 1:
              raise SystemExit('Expected sourceFuelCode helper exactly once')
          s = s.replace(old_helper, new_helper, 1)

          old_fuel_map = "function fuel(v){return translate(v,{petrol:'Бензин',gasoline:'Бензин',diesel:'Дизель',electric:'Электро',ev:'Электро',hybrid:'Гибрид',plug_in_hybrid:'Подзаряжаемый гибрид',phev:'Подзаряжаемый гибрид',gas:'Газ',lpg:'Газ',other:'Другое / не указан'})}"
          new_fuel_map = "function fuel(v){return translate(v,{petrol:'Бензин',gasoline:'Бензин',diesel:'Дизель',electric:'Электро',ev:'Электро',hybrid:'Гибрид',plug_in_hybrid:'Подзаряжаемый гибрид',phev:'Подзаряжаемый гибрид',erev:'Последовательный гибрид',reev:'Последовательный гибрид',series_hybrid:'Последовательный гибрид',series_hybrid:'Последовательный гибрид',gas:'Газ',lpg:'Газ',other:'Другое / не указан'})}"
          if s.count(old_fuel_map) == 1:
              s = s.replace(old_fuel_map, new_fuel_map, 1)
          elif s.count(new_fuel_map) != 1:
              raise SystemExit('Expected fuel map exactly once')

          old_calc = "function calcCustomsPaymentEuro(c,customsBaseUsd){var fuel=sourceFuelCode(c),band=pricingAgeBand(c),usdPerEur=apiUsdPerEur(),displacement=sourceDisplacement(c);if(['electric','ev','bev','electricity'].indexOf(fuel)>=0)return 0;if(!band||usdPerEur==null||!Number.isFinite(customsBaseUsd)||customsBaseUsd<0)return null;var customsValueEur=customsBaseUsd/usdPerEur;if(band==='0_3')return customsRateUpTo3(customsValueEur,displacement);var tariff=customsRateForDisplacement(displacement,band);return tariff==null?null:displacement*tariff}"
          new_calc = "function calcCustomsPaymentEuro(c,customsBaseUsd){var fuel=sourceFuelCode(c),hybridType=sourceHybridType(c),band=pricingAgeBand(c),usdPerEur=apiUsdPerEur(),displacement=sourceDisplacement(c);if(['electric','ev','bev','electricity'].indexOf(fuel)>=0&&hybridType!=='series')return 0;if(usdPerEur==null||!Number.isFinite(customsBaseUsd)||customsBaseUsd<0)return null;var customsValueEur=customsBaseUsd/usdPerEur;if(hybridType==='series'){var duty=customsValueEur*0.15;var vat=(customsValueEur+duty)*0.20;return duty+vat}if(!band)return null;if(band==='0_3')return customsRateUpTo3(customsValueEur,displacement);var tariff=customsRateForDisplacement(displacement,band);return tariff==null?null:displacement*tariff}"
          if s.count(old_calc) != 1:
              raise SystemExit('Expected calcCustomsPaymentEuro exactly once')
          s = s.replace(old_calc, new_calc, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = [
            'function sourceHybridType(c)',
            "if(hybridType==='series')",
            'var duty=customsValueEur*0.15',
            'var vat=(customsValueEur+duty)*0.20',
            "return duty+vat"
          ]
          for x in checks:
            assert x in s, x
          loader = Path('tilda-loader.js').read_text(encoding='utf-8')
          import subprocess
          sha = subprocess.check_output(['git','rev-parse','HEAD:tilda-loader.js'], text=True).strip()
          assert sha == 'caecc9eaa4b871b4b001d082403985a3bab05673', sha
          diff = subprocess.check_output(['git','diff','--','index.html','tilda-loader.js'], text=True)
          assert 'tilda-loader.js' not in diff
          print('Targeted verification passed')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/_fix-hybrid-classification.yml
          git rm .github/workflows/_fix-hybrid-classification.yml
          git commit -m 'fix: classify sequential hybrids separately in pricing'
          git push