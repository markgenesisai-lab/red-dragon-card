name: Current mobile only fix
on:
  push:
    paths:
      - '.github/workflows/current-mobile-only-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="#rd-red-dragon-card .rd-price-main{display:inline-flex;align-items:flex-start;justify-content:center;color:var(--rd-accent);font-size:38px;line-height:1;font-weight:700;letter-spacing:-.03em}"
          new=old[:-1]+"}"
          # Mobile-only section layout, registration label, and hidden buy bar.
          marker='@media(max-width:760px){#rd-red-dragon-card .rd-section-nav.rd-nav-fixed{padding:1px 10px}}'
          add='@media(max-width:760px){#rd-red-dragon-card .rd-vehicle-title-row{flex-direction:column;align-items:stretch}#rd-red-dragon-card .rd-vehicle-title{width:100%;flex:none}#rd-red-dragon-card .rd-vehicle-statuses{width:100%;flex:none;margin-top:12px}#rd-red-dragon-card .rd-mobile-buy{display:none!important;visibility:hidden!important;pointer-events:none!important}#rd-red-dragon-card .rd-key-spec-registration .rd-key-spec-label>span{font-size:0}#rd-red-dragon-card .rd-key-spec-registration .rd-key-spec-label>span:after{content:"Регистрац.";font-size:11px}}'
          assert s.count(marker)==1
          s=s.replace(marker,add+marker,1)
          # Mark only the registration key card without changing desktop rendering.
          old_card="<div class=\"rd-key-spec\"><div class=\"rd-key-spec-label\">'+(I[r[2]]||'')+'<span>'+esc(r[0])+'</span></div><div class=\"rd-key-spec-value\">'+esc(r[1])+'</div></div>"
          new_card="<div class=\"rd-key-spec'+(r[0]==='Регистрация'?' rd-key-spec-registration':'')+'\"><div class=\"rd-key-spec-label\">'+(I[r[2]]||'')+'<span>'+esc(r[0])+'</span></div><div class=\"rd-key-spec-value\">'+esc(r[1])+'</div></div>"
          assert s.count(old_card)==1
          s=s.replace(old_card,new_card,1)
          # Remove stray literal plus after the back button.
          old_plus='</button>+<div class="rd-feedback-modal"'
          new_plus='</button><div class="rd-feedback-modal"'
          assert s.count(old_plus)==1
          s=s.replace(old_plus,new_plus,1)
          # Brand gradient for the main USD price and modal USD prices.
          style='@media(min-width:0px){#rd-red-dragon-card .rd-price-main>span{background:var(--rd-accent-g);-webkit-background-clip:text;background-clip:text;color:transparent!important}#rd-red-dragon-card #rd-price-modal .rd-value[style*="color:var(--rd-accent)"]{background:var(--rd-accent-g);-webkit-background-clip:text;background-clip:text;color:transparent!important}#rd-red-dragon-card #rd-price-modal .rd-addon-usd{background:var(--rd-accent-g);-webkit-background-clip:text;background-clip:text;color:transparent!important}}'
          s=s.replace('</style><script>',style+'</style><script>',1)
          p.write_text(s,encoding='utf-8')
          assert s.count(add)==1
          assert s.count(new_card)==1
          assert s.count(new_plus)==1
          assert s.count(style)==1
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine mobile vehicle section and brand price gradients"
          git push origin main
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/current-mobile-only-fix.yml
          git add .github/workflows/current-mobile-only-fix.yml
          git commit -m "Remove temporary current mobile workflow"
          git push origin main
