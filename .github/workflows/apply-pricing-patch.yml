name: apply-pricing-patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pricing logic
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_load = r"function loadCatalogPricing\(id,detail\)\{.*?\} function sourceCountryCode"
          new_load = '''function loadCatalogPricing(id,detail){var usdValue=extractCatalogPrice(detail),rate=null,eurRate=null,item=null;try{var qs=new URLSearchParams({page:'1',pageSize:'30',sort:'added',order:'desc',q:String(id||'')}),d=await getRaw('/listings?'+qs.toString()),items=Array.isArray(d)?d:(d.items||d.listings||d.results||d.data?.items||d.data?.listings||d.data?.results||d.data?.cars||d.cars||[]);item=items.find(function(x){return String(x&&x.id||'')===String(id||'')})||null;if(item){var itemUsd=extractCatalogPrice(item);if(itemUsd!=null)usdValue=itemUsd}rate=Number(d&&d.meta&&d.meta.rates&&d.meta.rates.perUsd&&d.meta.rates.perUsd.BYN);if(!Number.isFinite(rate)||rate<=0)rate=Number(d&&d.data&&d.data.meta&&d.data.meta.rates&&d.data.meta.rates.perUsd&&d.data.meta.rates.perUsd.BYN);if(!Number.isFinite(rate)||rate<=0)rate=null;eurRate=Number(d&&d.meta&&d.meta.rates&&d.meta.rates.perUsd&&d.meta.rates.perUsd.EUR);if(!Number.isFinite(eurRate)||eurRate<=0)eurRate=Number(d&&d.data&&d.data.meta&&d.data.meta.rates&&d.data.meta.rates.perUsd&&d.data.meta.rates.perUsd.EUR);if(!Number.isFinite(eurRate)||eurRate<=0)eurRate=null;if(rate==null){var dr=detail&&detail.meta&&detail.meta.rates&&detail.meta.rates.perUsd&&detail.meta.rates.perUsd.BYN;rate=Number(dr);if(!Number.isFinite(rate)||rate<=0)rate=null}if(eurRate==null){var der=detail&&detail.meta&&detail.meta.rates&&detail.meta.rates.perUsd&&detail.meta.rates.perUsd.EUR;eurRate=Number(der);if(!Number.isFinite(eurRate)||eurRate<=0)eurRate=null}}catch(e){}return{usd:usdValue,rate:rate,eurRate:eurRate,country:sourceCountryCode(item||detail),item:item}} function sourceCountryCode'''
          s2, n = re.subn(old_load, new_load, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('LOAD_PRICING target not found')
          s = s2

          old_price = r"function apiRate\(\)\{.*?\} function priceCard"
          new_price = '''function apiRate(){var r=Number(__rdPricing&&__rdPricing.rate);return Number.isFinite(r)&&r>0?r:null} function apiEurRate(){var r=Number(__rdPricing&&__rdPricing.eurRate);return Number.isFinite(r)&&r>0?r:null} function sourcePriceUsd(c){var v=Number(__rdPricing&&__rdPricing.usd);return Number.isFinite(v)&&v>=0?v:extractCatalogPrice(c)} function sourceFuelCode(c){var v=specValue(c,'fuel');return String(v==null?'':v).trim().toLowerCase()} function sourceDisplacement(c){var s=c&&c.specs&&typeof c.specs==='object'?c.specs:{};var v=c&&c.displacement!=null?c.displacement:s.displacement;if(v==null||v===''){var ev=c&&c.engineVolume!=null?c.engineVolume:s.engineVolume;if(ev!=null&&ev!==''){var n=Number(String(ev).replace(',','.').replace(/[^0-9.\-]/g,''));if(Number.isFinite(n)&&n>0&&n<20)return n*1000}}var n2=Number(v);return Number.isFinite(n2)&&n2>0?n2:null} function manufactureDateForPricing(c){if(!c)return null;var raw=c.manufacturingDate??c.manufactureDate??c.productionDate;if(raw!=null&&raw!==''){var d=new Date(raw);if(!isNaN(d.getTime()))return d}var y=Number(c.manufacturingYear??c.productionYear??c.year);var m=Number(c.manufacturingMonth??c.manufactureMonth??c.productionMonth);if(Number.isInteger(y)&&y>1900&&Number.isInteger(m)&&m>=1&&m<=12)return new Date(y,m-1,1);return null} function pricingAgeBand(c){var d=manufactureDateForPricing(c);if(!d)return null;var now=new Date(),months=(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth());if(months<0)return null;if(months<=36)return'0_3';if(months<=60)return'3_5';return'5_plus'} function pricingMarkupRate(sourceUsd){if(!Number.isFinite(sourceUsd)||sourceUsd<0)return null;if(sourceUsd<20000)return 0.15;if(sourceUsd<=30000)return 0.08;if(sourceUsd<=50000)return 0.07;if(sourceUsd<=80000)return 0.06;return 0.05} function pricingDeliveryUsd(c){var code=sourceCountryCode(c);return code==='KR'?4500:2700} function customsRateForDisplacement(displacement,band){if(!Number.isFinite(displacement)||displacement<=0||!band)return null;var t=band==='3_5'?[[1000,1.5],[1500,1.7],[1800,2.5],[2300,2.7],[3000,3.0],[Infinity,3.6]]:[[1000,3.0],[1500,3.2],[1800,3.5],[2300,4.8],[3000,5.0],[Infinity,5.7]];for(var i=0;i<t.length;i++){if(displacement<=t[i][0])return t[i][1]}return null} function customsRateUpTo3(customsValueEur,displacement){var t=[[8500,0.54,2.5],[16700,0.48,3.5],[42300,0.48,5.5],[84500,0.48,7.5],[169000,0.48,15],[Infinity,0.48,20]];for(var i=0;i<t.length;i++){if(customsValueEur<=t[i][0]){var percent=customsValueEur*t[i][1],minimum=Number.isFinite(displacement)&&displacement>0?displacement*t[i][2]:0;return Math.max(percent,minimum)}}return null} function recyclingFeeByn(ageBand){if(ageBand==='0_3')return 624.92;if(ageBand==='3_5'||ageBand==='5_plus')return 1282.02;return null} function customsPaymentEuro(c,customsBaseUsd){var fuelCode=sourceFuelCode(c),band=pricingAgeBand(c),eurRate=apiEurRate(),displacement=sourceDisplacement(c);if(fuelCode==='electric'||fuelCode==='ev'){var mp=c&&c.mandatoryPayments;if(mp&&Number.isFinite(Number(mp.min))&&Number.isFinite(Number(mp.max))&&Number(mp.min)===Number(mp.max))return{euro:Number(mp.min),source:'api'};return null}if(!band||eurRate==null||!Number.isFinite(customsBaseUsd)||customsBaseUsd<0)return null;var baseEur=customsBaseUsd*eurRate;if(band==='0_3')return{euro:customsRateUpTo3(baseEur,displacement),source:'tariff'};var rate=customsRateForDisplacement(displacement,band);return rate==null?null:{euro:displacement*rate,source:'tariff'}} function priceData(c){var sourceUsd=sourcePriceUsd(c),rate=apiRate(),eurRate=apiEurRate(),deliveryActualUsd=sourceUsd!=null?pricingDeliveryUsd(c):null,markupRate=pricingMarkupRate(sourceUsd),markupUsd=sourceUsd!=null&&markupRate!=null?sourceUsd*markupRate:null,deliveryUsd=sourceUsd!=null&&deliveryActualUsd!=null&&markupUsd!=null?sourceUsd+deliveryActualUsd+markupUsd:null,customsBaseUsd=sourceUsd!=null&&deliveryActualUsd!=null?sourceUsd+deliveryActualUsd:null,sourceByn=sourceUsd!=null&&rate!=null?sourceUsd*rate:null,deliveryByn=deliveryUsd!=null&&rate!=null?deliveryUsd*rate:null,customsBaseEur=customsBaseUsd!=null&&eurRate!=null?customsBaseUsd*eurRate:null,customsRaw=customsBaseUsd!=null?customsPaymentEuro(c,customsBaseUsd):null,customsPaymentEur=customsRaw&&Number.isFinite(customsRaw.euro)?customsRaw.euro:null,customsPaymentAfter140Eur=customsPaymentEur!=null?customsPaymentEur*0.5:null,customsPaymentUsd=customsPaymentAfter140Eur!=null&&eurRate!=null?customsPaymentAfter140Eur/eurRate:null,ageBand=pricingAgeBand(c),recyclingByn=recyclingFeeByn(ageBand),customsOpsByn=120,svhByn=400,fixedByn=recyclingByn!=null?recyclingByn+customsOpsByn+svhByn:null,customsFinalByn=deliveryByn!=null&&customsPaymentUsd!=null&&rate!=null&&fixedByn!=null?deliveryByn+customsPaymentUsd*rate+fixedByn:null,customsFinalUsd=deliveryUsd!=null&&customsPaymentUsd!=null&&rate!=null&&fixedByn!=null?deliveryUsd+customsPaymentUsd+fixedByn/rate:null;return{sourceUsd:sourceUsd,sourceByn:sourceByn,rate:rate,eurRate:eurRate,deliveryActualUsd:deliveryActualUsd,markupRate:markupRate,markupUsd:markupUsd,deliveryUsd:deliveryUsd,deliveryByn:deliveryByn,customsBaseUsd:customsBaseUsd,customsBaseEur:customsBaseEur,customsPaymentEur:customsPaymentEur,customsPaymentAfter140Eur:customsPaymentAfter140Eur,customsPaymentUsd:customsPaymentUsd,ageBand:ageBand,recyclingByn:recyclingByn,customsOpsByn:customsOpsByn,svhByn:svhByn,customsFinalUsd:customsFinalUsd,customsFinalByn:customsFinalByn,customsSource:customsRaw&&customsRaw.source||null}} function refreshPriceValues'''
          s2, n = re.subn(old_price, new_price, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('PRICE_DATA target not found')
          s = s2

          old_refresh = r"function refreshPriceValues\(c\)\{.*?\} function priceCard"
          new_refresh = '''function refreshPriceValues(c){var d=priceData(c);root.querySelectorAll('[data-price-source-byn]').forEach(function(el){el.textContent=d.sourceByn!=null?bynText(d.sourceByn):'—'});root.querySelectorAll('[data-price-delivery-usd]').forEach(function(el){el.textContent=d.deliveryUsd!=null?usd(d.deliveryUsd):'Уточняется'});root.querySelectorAll('[data-price-delivery-byn]').forEach(function(el){el.textContent=d.deliveryByn!=null?bynText(d.deliveryByn):'—'});root.querySelectorAll('[data-price-customs-usd]').forEach(function(el){el.textContent=d.customsFinalUsd!=null?usd(d.customsFinalUsd):'Уточняется'});root.querySelectorAll('[data-price-customs-byn]').forEach(function(el){el.textContent=d.customsFinalByn!=null?bynText(d.customsFinalByn):'—'})} function priceCard'''
          s2, n = re.subn(old_refresh, new_refresh, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('REFRESH target not found')
          s = s2

          old_modal = r"function priceModal\(c\)\{.*?\} async function openReport"
          new_modal = '''function priceModal(c){var d=priceData(c),p=d.sourceUsd,b=d.sourceByn,deliveryLabel=d.deliveryActualUsd!=null?usd(d.deliveryActualUsd):'Уточняется',markupLabel=d.markupUsd!=null?usd(d.markupUsd):'Уточняется',customsBaseLabel=d.customsBaseUsd!=null?usd(d.customsBaseUsd):'Уточняется',customsPaymentLabel=d.customsPaymentAfter140Eur!=null?num(d.customsPaymentAfter140Eur.toFixed(2))+' €':'Уточняется',recyclingLabel=d.recyclingByn!=null?num(d.recyclingByn.toFixed(2))+' BYN':'Уточняется',finalUsdLabel=d.customsFinalUsd!=null?usd(d.customsFinalUsd):'Уточняется',finalBynLabel=d.customsFinalByn!=null?bynText(d.customsFinalByn):'—';root.querySelector('#rd-price-modal-body').innerHTML='<div style="display:flex;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--rd-border)"><div><div class="rd-label">Автомобиль</div><div class="rd-value" style="margin-top:4px">'+esc(c.title||'')+'</div></div><div style="text-align:right"><div class="rd-label">Исходная цена</div><div class="rd-value" style="margin-top:4px;color:var(--rd-accent)">'+usd(p)+'</div><div class="rd-addon-byn" style="margin-top:4px">'+esc(b!=null?bynText(b):'—')+'</div></div></div><div style="display:grid;gap:10px;margin-top:14px"><div class="rd-addon"><div class="rd-addon-title">Наценка</div><div class="rd-addon-usd" style="margin-top:3px">'+markupLabel+'</div><div class="rd-addon-note">Наценка считается от исходной цены автомобиля: '+(d.markupRate!=null?Math.round(d.markupRate*100)+'%':'Уточняется')+'.</div></div><div class="rd-addon"><div class="rd-addon-title">Фактическая доставка</div><div class="rd-addon-usd" style="margin-top:3px">'+deliveryLabel+'</div><div class="rd-addon-note">Китай — 2700 USD · Корея — 4500 USD.</div></div><div class="rd-addon"><div class="rd-addon-title">Цена с доставкой в РБ</div><div class="rd-addon-usd" style="margin-top:3px">'+(d.deliveryUsd!=null?usd(d.deliveryUsd):'Уточняется')+'</div><div class="rd-addon-byn">'+esc(d.deliveryByn!=null?bynText(d.deliveryByn):'—')+'</div><div class="rd-addon-note">Исходная цена + фактическая доставка + наценка от исходной цены.</div></div><div class="rd-addon"><div class="rd-addon-title">Таможенная база</div><div class="rd-addon-usd" style="margin-top:3px">'+customsBaseLabel+'</div><div class="rd-addon-note">Исходная цена + фактическая доставка. Наценка в таможенную базу не входит.</div></div><div class="rd-addon"><div class="rd-addon-title">Таможенный платеж после льготы №140</div><div class="rd-addon-usd" style="margin-top:3px">'+customsPaymentLabel+'</div><div class="rd-addon-note">Расчет для физического лица, личное использование: применена 50% льгота к таможенному платежу по Указу №140. Источник расчета: '+(d.customsSource==='tariff'?'тарифная формула':'данные API')+'.</div></div><div class="rd-addon"><div class="rd-addon-title">Дополнительные расходы</div><div class="rd-addon-usd" style="margin-top:3px">120 BYN + '+recyclingLabel+' + 400 BYN</div><div class="rd-addon-note">120 BYN — таможенная операция; 400 BYN — СВХ/внутренний расход сайта; утилизационный сбор зависит от возраста автомобиля.</div></div><div class="rd-addon"><div class="rd-addon-title">Цена с доставкой и таможней</div><div class="rd-addon-usd" style="margin-top:3px">'+finalUsdLabel+'</div><div class="rd-addon-byn">'+esc(finalBynLabel)+'</div><div class="rd-addon-note">Итог: цена с доставкой в РБ + таможенный платеж после льготы + фиксированные расходы и утилизационный сбор.</div></div></div><p class="rd-small rd-muted" style="margin:16px 0 0">Цена предварительная. Точную стоимость уточняйте в отделе продаж ООО "РЭД ДРЭГОН".</p>';var panel=root.querySelector('#rd-price-modal .rd-modal-panel');if(panel&&!panel.dataset.scrollbarsWired){panel.dataset.scrollbarsWired='1';var scrollTimer=0;panel.addEventListener('scroll',function(){panel.classList.add('is-scrolling');clearTimeout(scrollTimer);scrollTimer=setTimeout(function(){panel.classList.remove('is-scrolling')},450)},{passive:true})}openModal('rd-price-modal')} async function openReport'''
          s2, n = re.subn(old_modal, new_modal, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('PRICE_MODAL target not found')
          s = s2

          old_run = "__rdPricing.usd=pricing.usd;__rdPricing.rate=pricing.rate;__rdPricing.country=pricing.country;"
          new_run = "__rdPricing.usd=pricing.usd;__rdPricing.rate=pricing.rate;__rdPricing.eurRate=pricing.eurRate;__rdPricing.country=pricing.country;"
          if s.count(old_run) != 1: raise SystemExit('PRICING ASSIGN target not found')
          s = s.replace(old_run,new_run,1)

          if s.count('function apiEurRate(){') != 1: raise SystemExit('apiEurRate count invalid')
          if s.count('function pricingMarkupRate(sourceUsd){') != 1: raise SystemExit('pricingMarkupRate count invalid')
          if s.count('function customsPaymentEuro(c,customsBaseUsd){') != 1: raise SystemExit('customsPaymentEuro count invalid')
          if s.count('function priceData(c){') != 1: raise SystemExit('priceData count invalid')
          if 'sourceUsd<20000' not in s or 'sourceUsd<=30000' not in s or 'sourceUsd<=50000' not in s or 'sourceUsd<=80000' not in s: raise SystemExit('markup boundaries invalid')
          if "sourceUsd+actualDeliveryUsd" in s: raise SystemExit('forbidden customs/base pattern found')

          p.write_text(s,encoding='utf-8')

          import subprocess
          js = re.search(r'<script>([\\s\\S]*)</script>\\s*$', s)
          if not js: raise SystemExit('SCRIPT BLOCK NOT FOUND')
          Path('/tmp/card.js').write_text(js.group(1),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/card.js'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          print('PRICING_PATCH_OK')
      - name: Commit patched index and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-pricing-patch.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "index.html"
          git commit -m 'fix: update card delivery markup and customs pricing'
          git push