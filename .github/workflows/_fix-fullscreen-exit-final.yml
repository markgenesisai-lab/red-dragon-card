name: Fix fullscreen photo exit transition

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix fullscreen photo exit transition [auto]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch fullscreen animation
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''else if(mn){if(token2!==__rdGalleryChangeToken)return;mn.src=u;mn.classList.remove('rd-modal-current','rd-modal-exit-left','rd-modal-exit-right','rd-modal-enter-left','rd-modal-enter-right','rd-modal-entered');mn.classList.add(dir>0?'rd-modal-enter-right':'rd-modal-enter-left');void mn.offsetWidth;mn.classList.add('rd-modal-entered');var old=mi;old.classList.remove('rd-modal-current');old.classList.add(dir>0?'rd-modal-exit-left':'rd-modal-exit-right');setTimeout(function(){if(token2!==__rdGalleryChangeToken)return;old.classList.remove('rd-modal-exit-left','rd-modal-exit-right');mn.classList.remove('rd-modal-enter-left','rd-modal-enter-right','rd-modal-entered');mn.classList.add('rd-modal-current');old.src='' },450)}else mi.src=u'''
          new = '''else if(mn){if(token2!==__rdGalleryChangeToken)return;var old=mi;old.classList.remove('rd-modal-current','rd-modal-exit-left','rd-modal-exit-right','rd-modal-enter-left','rd-modal-enter-right','rd-modal-entered');mn.classList.remove('rd-modal-current','rd-modal-exit-left','rd-modal-exit-right','rd-modal-enter-left','rd-modal-enter-right','rd-modal-entered');old.classList.add('rd-modal-current');mn.src=u;mn.classList.add(dir>0?'rd-modal-enter-right':'rd-modal-enter-left');void old.offsetWidth;void mn.offsetWidth;old.classList.remove('rd-modal-current');old.classList.add(dir>0?'rd-modal-exit-left':'rd-modal-exit-right');mn.classList.add('rd-modal-entered');setTimeout(function(){if(token2!==__rdGalleryChangeToken)return;old.classList.remove('rd-modal-exit-left','rd-modal-exit-right');mn.classList.remove('rd-modal-enter-left','rd-modal-enter-right','rd-modal-entered');mn.classList.add('rd-modal-current');old.src='' },450)}else mi.src=u'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one fullscreen transition block, found {s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Verify exact patch
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert "void old.offsetWidth;void mn.offsetWidth;old.classList.remove('rd-modal-current')" in s
          assert "old.classList.add(dir>0?'rd-modal-exit-left':'rd-modal-exit-right');mn.classList.add('rd-modal-entered')" in s
          assert "mn.onload=function" not in s
          assert s.count("rd-modal-exit-left')") >= 1
      - name: Commit and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_fix-fullscreen-exit-final.yml
          git add index.html .github/workflows/_fix-fullscreen-exit-final.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix fullscreen photo exit transition [auto]"
          git push origin main
