name: Exact photo/spec fix 2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact fixes
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_logic = "else if(mn){mn.onload=function(){if(token2!==__rdGalleryChangeToken)return;mn.classList.remove('rd-modal-current','rd-modal-exit-left','rd-modal-exit-right','rd-modal-enter-left','rd-modal-enter-right','rd-modal-entered');mn.classList.add(dir>0?'rd-modal-enter-right':'rd-modal-enter-left');void mn.offsetWidth;mn.classList.add('rd-modal-entered');var old=mi;old.classList.remove('rd-modal-current');old.classList.add(dir>0?'rd-modal-exit-left':'rd-modal-exit-right');setTimeout(function(){if(token2!==__rdGalleryChangeToken)return;old.classList.remove('rd-modal-exit-left','rd-modal-exit-right');mn.classList.remove('rd-modal-enter-left','rd-modal-enter-right','rd-modal-entered');mn.classList.add('rd-modal-current');old.src='' },450)};mn.src=u}else mi.src=u"
          new_logic = "else if(mn){if(token2!==__rdGalleryChangeToken)return;mn.src=u;mn.classList.remove('rd-modal-current','rd-modal-exit-left','rd-modal-exit-right','rd-modal-enter-left','rd-modal-enter-right','rd-modal-entered');mn.classList.add(dir>0?'rd-modal-enter-right':'rd-modal-enter-left');void mn.offsetWidth;mn.classList.add('rd-modal-entered');var old=mi;old.classList.remove('rd-modal-current');old.classList.add(dir>0?'rd-modal-exit-left':'rd-modal-exit-right');setTimeout(function(){if(token2!==__rdGalleryChangeToken)return;old.classList.remove('rd-modal-exit-left','rd-modal-exit-right');mn.classList.remove('rd-modal-enter-left','rd-modal-enter-right','rd-modal-entered');mn.classList.add('rd-modal-current');old.src='' },450)}else mi.src=u"
          if s.count(old_logic) != 1:
              raise SystemExit(f'fullscreen transition block count={s.count(old_logic)}')
          s = s.replace(old_logic, new_logic, 1)

          old_state = "if(raw==='option'||raw==='опция'||x.isOption===true)return['option','Опция',I.calculator];"
          new_state = "if(raw==='option'||raw==='optional'||raw==='опция'||x.isOption===true)return['option','Опция',I.calculator];"
          if s.count(old_state) != 1:
              raise SystemExit(f'equipment optional mapping count={s.count(old_state)}')
          s = s.replace(old_state, new_state, 1)

          p.write_text(s, encoding='utf-8')
      - name: Validate scope
        shell: bash
        run: |
          git diff --check
          test "$(git status --short | grep -v '^?? .github/workflows/_exact-photo-spec-fix2.yml' | wc -l)" -eq 1
          test "$(git status --short | grep 'index.html' | wc -l)" -eq 1
          test "$(git status --short | grep 'tilda-loader.js' | wc -l)" -eq 0
      - name: Remove helper and commit final file
        shell: bash
        run: |
          git add index.html
          git rm .github/workflows/_exact-photo-spec-fix2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix fullscreen transition timing and optional state label'
          git push
