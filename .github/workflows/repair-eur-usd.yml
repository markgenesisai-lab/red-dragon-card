name: Repair EUR/USD pricing
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only EUR/USD loader
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = re.search(r"async function loadEurUsdRate\(\)\{.*?\} function sourceFuelCode", s, re.S)
          if not old:
              raise SystemExit('loadEurUsdRate block not found')
          new = """async function loadEurUsdRate(){var urls=['https://api.frankfurter.dev/v2/rate/eur/usd?providers=ecb','https://api.frankfurter.dev/v2/rate/eur/usd','https://api.frankfurter.dev/v2/rates?base=eur&quotes=usd&providers=ecb','https://api.frankfurter.dev/v1/latest?base=EUR&symbols=USD'];for(var i=0;i<urls.length;i++){var ctrl=('AbortController' in window)?new AbortController():null,timer=ctrl?setTimeout(function(c){return function(){try{c.abort()}catch(e){}}}(ctrl),7000):null;try{var r=await fetch(urls[i],{headers:{Accept:'application/json'},cache:'no-store',signal:ctrl?ctrl.signal:undefined});if(timer)clearTimeout(timer);if(!r.ok)continue;var d=await r.json().catch(function(){return{}}),rate=null;if(Number.isFinite(Number(d&&d.rate)))rate=Number(d.rate);if(rate==null&&Array.isArray(d)&&d.length&&Number.isFinite(Number(d[0]&&d[0].rate)))rate=Number(d[0].rate);if(rate==null&&d&&d.rates&&Number.isFinite(Number(d.rates.USD)))rate=Number(d.rates.USD);if(Number.isFinite(rate)&&rate>0)return rate}catch(e){if(timer)clearTimeout(timer)}}return null} function sourceFuelCode"""
          s = s[:old.start()] + new + s[old.end():]
          if s.count('async function loadEurUsdRate(){') != 1:
              raise SystemExit('unexpected loader count')
          if 'perUsd&&d.meta.rates&&d.meta.rates.perUsd&&d.meta.rates.perUsd.EUR' in s or 'apiEurRate(' in s:
              raise SystemExit('old EUR API dependency remains')
          p.write_text(s, encoding='utf-8')
      - name: Validate JavaScript and calculation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script>(function(){')+len('<script>')
          end=s.index('</script>', start)
          Path('/tmp/card.js').write_text(s[start:end],encoding='utf-8')
          assert "baseEur=customsBaseUsd/usdPerEur" in s
          assert "customsPaymentUsd=customsPaymentAfter140Eur!=null&&usdPerEur!=null?customsPaymentAfter140Eur*usdPerEur:null" in s
          assert "customsBaseUsd=sourceUsd!=null&&deliveryActualUsd!=null?sourceUsd+deliveryActualUsd:null" in s
          assert "tilda-loader.js" not in s
          print('formula checks: OK')
          PY
          node --check /tmp/card.js
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-eur-usd.yml
          git add index.html
          git commit -m 'fix: make EUR/USD customs conversion robust'
          git push
