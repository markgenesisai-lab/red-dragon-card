name: Apply exact photo and spec fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Desktop fullscreen: make the two modal images a real sliding pair.
          anchor = '#rd-red-dragon-card .rd-fullscreen-img{transition:opacity .2s ease,transform .35s cubic-bezier(.22,1,.36,1);will-change:opacity,transform;user-select:none;-webkit-user-drag:none}'
          if s.count(anchor) != 1:
              raise SystemExit(f'fullscreen anchor count={s.count(anchor)}, expected 1')
          desktop_css = '@media(min-width:900px){#rd-red-dragon-card .rd-fullscreen-img{position:absolute;left:50%;top:50%;max-width:92vw;max-height:88vh;transform:translate(-50%,-50%);transition:none}#rd-red-dragon-card .rd-fullscreen-img.rd-modal-current{z-index:2;opacity:1;transform:translate(-50%,-50%)}#rd-red-dragon-card .rd-fullscreen-img.rd-modal-enter-left,#rd-red-dragon-card .rd-fullscreen-img.rd-modal-enter-right{z-index:3;opacity:1;transition:none}#rd-red-dragon-card .rd-fullscreen-img.rd-modal-enter-left{transform:translate(calc(-50% - 100vw),-50%)}#rd-red-dragon-card .rd-fullscreen-img.rd-modal-enter-right{transform:translate(calc(-50% + 100vw),-50%)}#rd-red-dragon-card .rd-fullscreen-img.rd-modal-entered{transform:translate(-50%,-50%);transition:transform .32s cubic-bezier(.22,1,.36,1)}#rd-red-dragon-card .rd-fullscreen-img.rd-modal-exit-left,#rd-red-dragon-card .rd-fullscreen-img.rd-modal-exit-right{z-index:2;opacity:1;transition:transform .32s cubic-bezier(.22,1,.36,1)}#rd-red-dragon-card .rd-fullscreen-img.rd-modal-exit-left{transform:translate(calc(-50% - 100vw),-50%)}#rd-red-dragon-card .rd-fullscreen-img.rd-modal-exit-right{transform:translate(calc(-50% + 100vw),-50%)}}'
          if desktop_css in s:
              raise SystemExit('desktop fullscreen CSS already present')
          s = s.replace(anchor, anchor + desktop_css, 1)

          # The same two-image transition must run on desktop; mobile behavior remains the existing branch.
          old_mobile_gate = "}else if(mn&&isMobile){mn.onload=function(){if(token2!==__rdGalleryChangeToken)return;mn.classList.remove('rd-modal-current','rd-modal-exit-left','rd-modal-exit-right','rd-modal-enter-left','rd-modal-enter-right','rd-modal-entered');mn.classList.add(dir>0?'rd-modal-enter-right':'rd-modal-enter-left');void mn.offsetWidth;mn.classList.add('rd-modal-entered');var old=mi;old.classList.remove('rd-modal-current');old.classList.add(dir>0?'rd-modal-exit-left':'rd-modal-exit-right');setTimeout(function(){if(token2!==__rdGalleryChangeToken)return;old.classList.remove('rd-modal-exit-left','rd-modal-exit-right');mn.classList.remove('rd-modal-enter-left','rd-modal-enter-right','rd-modal-entered');mn.classList.add('rd-modal-current');old.src='' },450)};mn.src=u}else mi.src=u"
          old_already_broad = "}else if(mn){mn.onload=function(){if(token2!==__rdGalleryChangeToken)return;mn.classList.remove('rd-modal-current','rd-modal-exit-left','rd-modal-exit-right','rd-modal-enter-left','rd-modal-enter-right','rd-modal-entered');mn.classList.add(dir>0?'rd-modal-enter-right':'rd-modal-enter-left');void mn.offsetWidth;mn.classList.add('rd-modal-entered');var old=mi;old.classList.remove('rd-modal-current');old.classList.add(dir>0?'rd-modal-exit-left':'rd-modal-exit-right');setTimeout(function(){if(token2!==__rdGalleryChangeToken)return;old.classList.remove('rd-modal-exit-left','rd-modal-exit-right');mn.classList.remove('rd-modal-enter-left','rd-modal-enter-right','rd-modal-entered');mn.classList.add('rd-modal-current');old.src='' },450)};mn.src=u}else mi.src=u"
          new_js = old_already_broad
          if old_mobile_gate in s:
              s = s.replace(old_mobile_gate, new_js, 1)
          elif old_already_broad not in s:
              raise SystemExit('fullscreen JS transition block not found')

          # Grey out all text inside specification accordion content, without changing section headings.
          old_spec_name = '#rd-red-dragon-card .rd-equipment-name{min-width:0;flex:1;color:var(--rd-fg);font-size:12px;line-height:16px}'
          new_spec_name = '#rd-red-dragon-card .rd-equipment-name{min-width:0;flex:1;color:var(--rd-muted);font-size:12px;line-height:16px}'
          if s.count(old_spec_name) == 1:
              s = s.replace(old_spec_name, new_spec_name, 1)
          elif s.count(new_spec_name) != 1:
              raise SystemExit('equipment-name rule not found in expected state')

          state_rule = '#rd-red-dragon-card .rd-equipment-state{display:inline-flex;align-items:center;gap:5px;flex:none;color:var(--rd-muted);font-size:11px}'
          # Normalize semantic state colors to the same muted content tone only in the specification body.
          s = s.replace('#rd-red-dragon-card .rd-equipment-state.yes{color:var(--rd-success)}', '#rd-red-dragon-card .rd-equipment-state.yes{color:var(--rd-muted)}', 1)
          s = s.replace('#rd-red-dragon-card .rd-equipment-state.no{color:var(--rd-danger)}', '#rd-red-dragon-card .rd-equipment-state.no{color:var(--rd-muted)}', 1)
          s = s.replace('#rd-red-dragon-card .rd-equipment-state.option{color:#b7791f}', '#rd-red-dragon-card .rd-equipment-state.option{color:var(--rd-muted)}', 1)

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --name-only)" = "index.html" || { echo 'Unexpected changed files'; git diff --name-only; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_exact_ui_fix.yml
          git add index.html .github/workflows/_exact_ui_fix.yml
          git commit -m "Fix desktop fullscreen photo slide and spec text tone"
          git push
