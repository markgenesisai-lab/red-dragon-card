name: desktop nav fix
on:
  push:
    branches: [codex-desktop-nav-copy-20260914]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile navigation mechanism to desktop
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          a="var nav=root.querySelector('.rd-section-nav');if(nav&&window.matchMedia&&window.matchMedia('(max-width:899px)').matches){"
          assert s.count(a)==1
          s=s.replace(a,"var nav=root.querySelector('.rd-section-nav');if(nav){",1)
          a="var mobile=window.matchMedia&&window.matchMedia('(max-width:899px)').matches;if(!mobile){nav.classList.remove('rd-nav-fixed');navSpacer.classList.remove('rd-nav-spacer-active');navFixed=false;return}"
          assert s.count(a)==1
          s=s.replace(a,'',1)
          a="var headerH=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header-h'))||62;"
          assert s.count(a)==1
          s=s.replace(a,"var headerH=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header-h'));if(!Number.isFinite(headerH)||headerH<=0)headerH=window.matchMedia&&window.matchMedia('(max-width:899px)').matches?62:72;",1)
          css="@media(min-width:900px){#rd-red-dragon-card .rd-section-nav.rd-nav-fixed{position:fixed;left:0;right:0;top:var(--rd-nav-top,var(--header-h,72px));z-index:calc(var(--header-z,1000) - 1);margin:0;padding:6px max(10px,calc((100vw - 1152px)/2));background:color-mix(in oklch,var(--rd-bg) 92%,transparent);box-shadow:0 4px 16px rgba(0,0,0,.08)}#rd-red-dragon-card .rd-section-nav.rd-nav-fixed .rd-segment{width:100%;max-width:1152px;margin:0 auto}#rd-red-dragon-card .rd-section-nav-spacer{display:none;height:0}#rd-red-dragon-card .rd-section-nav-spacer.rd-nav-spacer-active{display:block}}"
          marker='</style>'
          assert s.count(marker)==1
          s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate scope
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          grep -F "var nav=root.querySelector('.rd-section-nav');if(nav){" index.html
          grep -F "@media(min-width:900px){#rd-red-dragon-card .rd-section-nav.rd-nav-fixed{position:fixed" index.html
      - name: Commit only index.html and remove helpers
        shell: bash
        run: |
          git add index.html
          git rm .github/workflows/_desktop-nav-fix.yml
          rm -f _trigger.txt
          git add -u || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: copy mobile section navigation mechanism to desktop'
          git push
