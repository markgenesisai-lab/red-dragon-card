name: apply-pricing-patch-v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only priceData
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="function priceData(c){var sourceUsd=sourcePriceUsd(c),rate=apiRate(),sourceByn=sourceUsd!=null&&rate!=null?bynNumber(sourceUsd*rate):null,deliveryUsd=sourceUsd!=null?sourceUsd+2000:null,customsUsd=sourceUsd!=null?sourceUsd+4000:null,deliveryByn=deliveryUsd!=null&&rate!=null?bynNumber(deliveryUsd*rate):null,customsByn=customsUsd!=null&&rate!=null?bynNumber(customsUsd*rate):null;return{sourceUsd:sourceUsd,sourceByn:sourceByn,rate:rate,deliveryUsd:deliveryUsd,deliveryByn:deliveryByn,customsUsd:customsUsd,customsByn:customsByn}}"
          new="""function apiEurRate(c){var r=Number(__rdPricing&&__rdPricing.eurRate);if(Number.isFinite(r)&&r>0)return r;var m=c&&c.meta&&c.meta.rates&&c.meta.rates.perUsd&&c.meta.rates.perUsd.EUR;return Number.isFinite(Number(m))&&Number(m)>0?Number(m):null} function sourceFuelCode(c){var v=c&&c.specs&&typeof c.specs==='object'?c.specs.fuel:null;v=v==null&&c?c.fuel:null;return String(v==null?'':v).trim().toLowerCase()} function sourceDisplacement(c){var s=c&&c.specs&&typeof c.specs==='object'?c.specs:{};var v=c&&c.displacement!=null?c.displacement:s.displacement;if(v==null||v===''){var ev=c&&c.engineVolume!=null?c.engineVolume:s.engineVolume;if(ev!=null&&ev!==''){var n=Number(String(ev).replace(',','.').replace(/[^0-9.\\-]/g,''));if(Number.isFinite(n)&&n>0&&n<20)return n*1000}}var n2=Number(v);return Number.isFinite(n2)&&n2>0?n2:null} function manufactureDateForPricing(c){if(!c)return null;var raw=c.manufacturingDate??c.manufactureDate??c.productionDate;if(raw!=null&&raw!==''){var d=new Date(raw);if(!isNaN(d.getTime()))return d}var y=Number(c.manufacturingYear??c.productionYear??c.year),m=Number(c.manufacturingMonth??c.manufactureMonth??c.productionMonth);if(Number.isInteger(y)&&y>1900&&Number.isInteger(m)&&m>=1&&m<=12)return new Date(y,m-1,1);return null} function pricingAgeBand(c){var d=manufactureDateForPricing(c);if(!d)return null;var now=new Date(),months=(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth());if(months<0)return null;if(months<=36)return'0_3';if(months<=60)return'3_5';return'5_plus'} function pricingMarkupRate(sourceUsd){if(!Number.isFinite(sourceUsd)||sourceUsd<0)return null;if(sourceUsd<20000)return 0.15;if(sourceUsd<=30000)return 0.08;if(sourceUsd<=50000)return 0.07;if(sourceUsd<=80000)return 0.06;return 0.05} function pricingDeliveryUsd(c){return sourceCountryCode(c)==='KR'?4500:2700} function customsRateForDisplacement(displacement,band){if(!Number.isFinite(displacement)||displacement<=0||!band)return null;var t=band==='3_5'?[[1000,1.5],[1500,1.7],[1800,2.5],[2300,2.7],[3000,3.0],[Infinity,3.6]]:[[1000,3.0],[1500,3.2],[1800,3.5],[2300,4.8],[3000,5.0],[Infinity,5.7]];for(var i=0;i<t.length;i++)if(displacement<=t[i][0])return t[i][1];return null} function customsRateUpTo3(customsValueEur,displacement){var t=[[8500,0.54,2.5],[16700,0.48,3.5],[42300,0.48,5.5],[84500,0.48,7.5],[169000,0.48,15],[Infinity,0.48,20]];for(var i=0;i<t.length;i++)if(customsValueEur<=t[i][0]){var percentage=customsValueEur*t[i][1],minimum=Number.isFinite(displacement)&&displacement>0?displacement*t[i][2]:0;return Math.max(percentage,minimum)}return null} function recyclingFeeByn(ageBand){return ageBand==='0_3'?624.92:ageBand==='3_5'||ageBand==='5_plus'?1282.02:null} function calcCustomsPaymentEuro(c,customsBaseUsd){var fuel=sourceFuelCode(c),band=pricingAgeBand(c),eurRate=apiEurRate(c),displacement=sourceDisplacement(c);if(fuel==='electric'||fuel==='ev'){return 0}if(!band||eurRate==null||!Number.isFinite(customsBaseUsd)||customsBaseUsd<0)return null;var baseEur=customsBaseUsd*eurRate;if(band==='0_3')return customsRateUpTo3(baseEur,displacement);var rate=customsRateForDisplacement(displacement,band);return rate==null?null:displacement*rate} function priceData(c){var sourceUsd=sourcePriceUsd(c),rate=apiRate(),eurRate=apiEurRate(c),deliveryActualUsd=sourceUsd!=null?pricingDeliveryUsd(c):null,markupRate=pricingMarkupRate(sourceUsd),markupUsd=sourceUsd!=null&&markupRate!=null?sourceUsd*markupRate:null,deliveryUsd=sourceUsd!=null&&deliveryActualUsd!=null&&markupUsd!=null?sourceUsd+deliveryActualUsd+markupUsd:null,customsBaseUsd=sourceUsd!=null&&deliveryActualUsd!=null?sourceUsd+deliveryActualUsd:null,sourceByn=sourceUsd!=null&&rate!=null?bynNumber(sourceUsd*rate):null,deliveryByn=deliveryUsd!=null&&rate!=null?bynNumber(deliveryUsd*rate):null,customsPaymentEuro=customsBaseUsd!=null?calcCustomsPaymentEuro(c,customsBaseUsd):null,customsPaymentAfter140Eur=customsPaymentEuro!=null?customsPaymentEuro*0.5:null,customsPaymentUsd=customsPaymentAfter140Eur!=null&&eurRate!=null?customsPaymentAfter140Eur/eurRate:null,ageBand=pricingAgeBand(c),recyclingByn=recyclingFeeByn(ageBand),customsOpsByn=120,svhByn=400,fixedByn=recyclingByn!=null?recyclingByn+customsOpsByn+svhByn:null,customsByn=deliveryByn!=null&&customsPaymentUsd!=null&&rate!=null&&fixedByn!=null?deliveryByn+customsPaymentUsd*rate+fixedByn:null,customsUsd=deliveryUsd!=null&&customsPaymentUsd!=null&&rate!=null&&fixedByn!=null?deliveryUsd+customsPaymentUsd+fixedByn/rate:null;return{sourceUsd:sourceUsd,sourceByn:sourceByn,rate:rate,deliveryActualUsd:deliveryActualUsd,markupRate:markupRate,markupUsd:markupUsd,deliveryUsd:deliveryUsd,deliveryByn:deliveryByn,customsBaseUsd:customsBaseUsd,customsPaymentEuro:customsPaymentEuro,customsPaymentAfter140Eur:customsPaymentAfter140Eur,customsPaymentUsd:customsPaymentUsd,ageBand:ageBand,recyclingByn:recyclingByn,customsOpsByn:customsOpsByn,svhByn:svhByn,customsUsd:customsUsd,customsByn:customsByn}}"""
          if s.count(old)!=1: raise SystemExit('PRICE_DATA exact target not found')
          s=s.replace(old,new,1)
          assert 'if(sourceUsd<20000)return 0.15;' in s
          assert 'if(sourceUsd<=30000)return 0.08;' in s
          assert 'customsBaseUsd=sourceUsd!=null&&deliveryActualUsd!=null?sourceUsd+deliveryActualUsd:null' in s
          assert 'deliveryUsd=sourceUsd!=null&&deliveryActualUsd!=null&&markupUsd!=null?sourceUsd+deliveryActualUsd+markupUsd:null' in s
          js=re.search(r'<script>([\\s\\S]*)</script>\\s*$',s)
          if not js: raise SystemExit('SCRIPT BLOCK NOT FOUND')
          Path('/tmp/card.js').write_text(js.group(1),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/card.js'],check=True)
          p.write_text(s,encoding='utf-8')
          subprocess.run(['git','diff','--check'],check=True)
      - name: Commit only index
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-pricing-patch-v2.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          test "$(git diff --cached --name-only)" = "index.html"
          git diff --cached --check
          git commit -m 'fix: update card delivery markup and customs pricing'
          git push