name: _fix-ev-pricing-final
on:
  push:
    paths:
      - '.github/workflows/_fix-ev-pricing-final.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch only index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function sourceFuelCode(c){var s=c&&c.specs&&typeof c.specs==='object'?c.specs:{},v=s.fuel??s.fuelType??s.fuel_type??(c&&c.fuel)??(c&&c.fuelType)??(c&&c.fuel_type);return String(v==null?'':v).trim().toLowerCase()} function sourceDisplacement"
          new = "function sourceFuelCode(c){var s=c&&c.specs&&typeof c.specs==='object'?c.specs:{},keys=['fuel','fuelType','fuel_type','energy','energyType','energy_type'];for(var i=0;i<keys.length;i++){var k=keys[i],sv=s[k],cv=c&&c[k];if(sv!=null&&String(sv).trim()!=='')return String(sv).trim().toLowerCase();if(cv!=null&&String(cv).trim()!=='')return String(cv).trim().toLowerCase()}return''} function sourceDisplacement"
          if old not in s:
              raise SystemExit('sourceFuelCode pattern not found')
          s=s.replace(old,new,1)
          old = "function manufactureDateForPricing(c){if(!c)return null;var y=Number(c.manufacturingYear??c.productionYear??c.year),m=Number(c.manufacturingMonth??c.manufactureMonth??c.productionMonth);if(Number.isInteger(y)&&y>1900&&Number.isInteger(m)&&m>=1&&m<=12)return new Date(y,m-1,1);return null}"
          new = "function manufactureDateForPricing(c){if(!c)return null;var rawDate=c.manufacturingDate??c.manufactureDate??c.productionDate??c.production_date;if(rawDate!=null&&String(rawDate).trim()!==''){var rd=new Date(rawDate);if(Number.isFinite(rd.getTime()))return new Date(rd.getFullYear(),rd.getMonth(),1);var ms=String(rawDate).trim().match(/^(\\d{4})[-./](\\d{1,2})/);if(ms){var ry=Number(ms[1]),rm=Number(ms[2]);if(Number.isInteger(ry)&&ry>1900&&Number.isInteger(rm)&&rm>=1&&rm<=12)return new Date(ry,rm-1,1)}}var y=Number(c.manufacturingYear??c.productionYear??c.year),m=Number(c.manufacturingMonth??c.manufactureMonth??c.productionMonth);if(Number.isInteger(y)&&y>1900&&Number.isInteger(m)&&m>=1&&m<=12)return new Date(y,m-1,1);return null}"
          if old not in s:
              raise SystemExit('manufactureDateForPricing pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify exact scope and commit
        shell: bash
        run: |
          git diff -- index.html
          test "$(git diff --numstat -- index.html | awk '{print $1+0+$2+0}')" -eq 4
          test "$(git diff --name-only)" = "index.html"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: robust EV pricing field detection'
          git push
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/_fix-ev-pricing-final.yml
          git add -u .github/workflows/_fix-ev-pricing-final.yml || true
          git diff --cached --quiet && exit 0 || true
          git commit -m 'chore: remove temporary EV pricing workflow'
          git push
