name: RD mobile/specification fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rd-mobile-spec-fix.yml
      - index.html

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply exact index.html patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          changes = [
          (
          '#rd-red-dragon-card .rd-fullscreen-close{top:20px;right:max(2px,env(safe-area-inset-right));z-index:10}',
          '#rd-red-dragon-card .rd-fullscreen-close{top:64px;right:0;z-index:10}'
          ),
          (
          '#rd-red-dragon-card .rd-back-button{right:auto;left:50%;bottom:76px;transform:translateX(-50%)}',
          '#rd-red-dragon-card .rd-back-button{right:auto;left:50%;bottom:36px;transform:translateX(-50%)}'
          ),
          (
          '#rd-red-dragon-card .rd-mobile-buy{position:fixed;left:0;right:0;bottom:0;z-index:80;display:none;padding:9px 10px calc(9px +env(safe-area-inset-bottom));background:color-mix(in oklch,var(--rd-surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--rd-border)}#rd-red-dragon-card .rd-mobile-buy-inner{width:min(1152px,100%);margin:0 auto;display:flex;align-items:center;gap:12px}#rd-red-dragon-card .rd-mobile-buy-price{min-width:0;flex:1}#rd-red-dragon-card .rd-mobile-buy-price small{display:block;color:var(--rd-muted);font-size:10px}#rd-red-dragon-card .rd-mobile-buy-price strong{display:block;margin-top:1px;color:var(--rd-accent);font-size:18px;line-height:20px}#rd-red-dragon-card .rd-mobile-buy-byn{display:block;margin-top:1px;color:var(--rd-muted);font-size:11px;line-height:15px;font-weight:600}#rd-red-dragon-card .rd-mobile-buy .rd-primary{width:auto;min-width:150px}',
          ''
          ),
          (
          '@media(max-width:899px){#rd-red-dragon-card{padding-bottom:84px}#rd-red-dragon-card .rd-mobile-buy{display:block}}',
          '@media(max-width:899px){#rd-red-dragon-card{padding-bottom:0}}'
          ),
          (
          'root.querySelectorAll(\'[data-mobile-price-usd]\').forEach(function(el){el.textContent=d.sourceUsd!=null?usd(d.sourceUsd):\'—\'});root.querySelectorAll(\'[data-mobile-price-byn]\').forEach(function(el){el.textContent=d.sourceByn!=null?bynText(d.sourceByn):\'—\'});',
          ''
          ),
          (
          '<div class="rd-mobile-buy"><div class="rd-mobile-buy-inner"><div class="rd-mobile-buy-price"><small>Цена в \'+sourceCountryName(c)+\'</small><strong data-mobile-price-usd>\'+esc(priceData(c).sourceUsd!=null?usd(priceData(c).sourceUsd):\'—\')+\'</strong><span class="rd-mobile-buy-byn" data-mobile-price-byn>\'+esc(priceData(c).sourceByn!=null?bynText(priceData(c).sourceByn):\'—\')+\'</span></div><button class="rd-primary" type="button" data-request>Узнать детали</button></div></div>',
          ''
          ),
          (
          'route:\'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M9 18h5a4 4 0 0 0 0-8H10a4 4 0 0 1 0-8"/></svg>\'',
          'route:\'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v1a4 4 0 0 1-4 4h-4a4 4 0 0 0-4 4"/></svg>\''
          ),
          (
          'map:\'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-5.4 10-7.4 11.8a1 1 0 0 1-1.2 0C9.4 20 4 15 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>\'',
          'map:\'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-5.4 10-7.4 11.8a1 1 0 0 1-1.2 0C9.4 20 4 15 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>\''
          ),
          (
          'route:\'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v1a4 4 0 0 1-4 4h-4a4 4 0 0 0-4 4"/></svg>\',fuel:',
          'route:\'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v1a4 4 0 0 1-4 4h-4a4 4 0 0 0-4 4"/></svg>\',drive:\'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="2"/><circle cx="18" cy="7" r="2"/><circle cx="6" cy="17" r="2"/><circle cx="18" cy="17" r="2"/><path d="M8 7h8M8 17h8M6 9v6M18 9v6"/></svg>\',fuel:'
          ),
          (
          "['Привод',drive(s.drive||c.drive),'circle']",
          "['Привод',drive(s.drive||c.drive),'drive']"
          ),
          (
          "['КПП',gearbox(s.gearbox||c.gearbox),'settings'],['Тип кузова',bodyType(s.body||c.body),'car']",
          "['КПП',gearbox(s.gearbox||c.gearbox),'settings'],['Тип кузова',bodyType(s.body||c.body),'car'],['Объём двигателя',engineLabel(c),'cylinder']"
          )
          ]

          for old, new in changes:
              if old not in s:
                  raise SystemExit(f'MISSING PATCH TARGET: {old[:180]}')
              if s.count(old) != 1:
                  raise SystemExit(f'PATCH TARGET COUNT {s.count(old)} != 1: {old[:180]}')
              s = s.replace(old, new, 1)

          # Remove the desktop key-card engine addition again; engine is mobile-only here.
          old = "['КПП',gearbox(s.gearbox||c.gearbox),'settings'],['Тип кузова',bodyType(s.body||c.body),'car'],['Объём двигателя',engineLabel(c),'cylinder']"
          new = "['КПП',gearbox(s.gearbox||c.gearbox),'settings'],['Тип кузова',bodyType(s.body||c.body),'car']"
          if old not in s or s.count(old) != 1:
              raise SystemExit('MISSING ENGINE ROLLBACK TARGET')
          s = s.replace(old, new, 1)

          old = "</section><dl class=\"rd-spec-list\">"
          new = "<div class=\"rd-key-spec rd-key-spec-engine-mobile\"><div class=\"rd-key-spec-label\">'+(I.cylinder||'')+'<span>Объём двигателя</span></div><div class=\"rd-key-spec-value\">'+esc(engineLabel(c))+'</div></div></section><dl class=\"rd-spec-list\">"
          if old not in s or s.count(old) != 1:
              raise SystemExit('MISSING MOBILE ENGINE INSERT TARGET')
          s = s.replace(old, new, 1)

          old = '#rd-red-dragon-card .rd-key-spec-label{display:flex;align-items:center;gap:6px;min-width:0;color:var(--rd-muted);font-size:11px;line-height:14px}'
          new = old+'#rd-red-dragon-card .rd-key-spec-engine-mobile{display:none}'
          if old not in s or s.count(old) != 1:
              raise SystemExit('MISSING KEY SPEC CSS TARGET')
          s = s.replace(old, new, 1)

          old = '#rd-red-dragon-card .rd-acc-btn svg{width:16px;height:16px;color:var(--rd-muted);transition:transform .18s ease}#rd-red-dragon-card .rd-accordion.open .rd-acc-btn svg{transform:rotate(180deg)}'
          new = old+'#rd-red-dragon-card .rd-accordion.open .rd-acc-btn{color:var(--rd-accent)}#rd-red-dragon-card .rd-accordion.open .rd-acc-count{color:var(--rd-accent)}#rd-red-dragon-card .rd-accordion.open .rd-acc-btn svg{color:var(--rd-accent)}'
          if old not in s or s.count(old) != 1:
              raise SystemExit('MISSING ACCORDION CSS TARGET')
          s = s.replace(old, new, 1)

          old = "return'<div class=\"rd-equipment-item\" data-equipment-text=\"'+esc(String(x.name||'')+' '+String(x.value||''))+ '\"><div class=\"rd-equipment-name\">'+esc(x.name||x.title||'')+'</div><div class=\"rd-equipment-state '+st[0]+'\">'+st[2]+'<span>'+esc(x.value||st[1])+'</span></div></div>'"
          if old not in s:
              old = "return'<div class=\"rd-equipment-item\" data-equipment-text=\"'+esc(String(x.name||'')+' '+String(x.value||''))+'\"><div class=\"rd-equipment-name\">'+esc(x.name||x.title||'')+'</div><div class=\"rd-equipment-state '+st[0]+'\">'+st[2]+'<span>'+esc(x.value||st[1])+'</span></div></div>'"
          if old not in s or s.count(old) != 1:
              raise SystemExit('MISSING EQUIPMENT ICON TARGET')
          new = old.replace("+'\">'+st[2]+'<span>'", "+'\"><span>'")
          s = s.replace(old, new, 1)

          old = '@media(max-width:760px){#rd-red-dragon-card .rd-fullscreen-close{top:64px;right:0;z-index:10}#rd-red-dragon-card .rd-fullscreen-prev{left:max(4px,env(safe-area-inset-left));z-index:10;opacity:1!important;visibility:visible!important}#rd-red-dragon-card .rd-fullscreen-next{right:max(4px,env(safe-area-inset-right));z-index:10;opacity:1!important;visibility:visible!important}#rd-red-dragon-card .rd-fullscreen-img{width:auto!important;height:auto!important;max-width:calc(100vw - 16px)!important;max-height:calc(100vh - 16px)!important;object-fit:contain}}'
          new = old + '@media(max-width:760px){#rd-red-dragon-card .rd-key-spec-engine-mobile{display:block}#rd-red-dragon-card .rd-key-spec-registration .rd-key-spec-label{white-space:nowrap}#rd-red-dragon-card .rd-price-top{align-items:flex-start}#rd-red-dragon-card .rd-calc-btn{margin-top:21px}}'
          if old not in s or s.count(old) != 1:
              raise SystemExit('MISSING MOBILE CSS INSERT TARGET')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          print('PATCH_OK')
          PY

          python3 -m py_compile <(printf '') 2>/dev/null || true
          grep -o 'rd-mobile-buy' index.html | wc -l | grep '^0$'
          grep -o 'data-mobile-price-' index.html | wc -l | grep '^0$'
          grep -o 'st\[2\]' index.html | wc -l | grep '^0$'
          grep -o 'rd-key-spec-engine-mobile' index.html | wc -l | grep '^2$'
          grep -o 'rd-accordion.open .rd-acc-btn' index.html | wc -l | grep '^1$'
          grep -o 'rd-fullscreen-close{top:64px;right:0;z-index:10}' index.html | wc -l | grep '^1$'
          grep -o 'rd-back-button{right:auto;left:50%;bottom:36px' index.html | wc -l | grep '^1$'

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/rd-mobile-spec-fix.yml
          git rm .github/workflows/rd-mobile-spec-fix.yml
          git commit -m "fix: refine mobile card and factory specification"
          git push
